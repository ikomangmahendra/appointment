<!--
  PROTOTYPE — throwaway code, do not build on top of this.

  Sibling route to patient-management.prototype.html (feedback: "tampilkan
  detail pasien di page baru"). Three sections: Profil, Riwayat Kunjungan
  (sorted by most recent, 10 per page — server-side pagination in the real
  app, faked client-side here over canned data), and Akun Pasien.

  NOTE ON AKUN PASIEN: CONTEXT.md defines Akun Pasien as a phone-number +
  OTP credential — it does not mention email or a password. The requested
  "email" and "password expiration" fields below are rendered as asked, but
  they don't match that definition yet. Flagging this rather than silently
  building against a model CONTEXT.md doesn't describe — worth confirming
  before this becomes real (and updating CONTEXT.md / an ADR if the auth
  model is actually changing to include email+password).

  This file has its own copy of PATIENTS_DB (see patient-management's for
  the "real" shared shape) with one patient given 13 visits to demonstrate
  pagination, and one left with zero visits to demonstrate the empty state.

  Run: open this file directly in a browser (double-click / File > Open).
  Try: ?id=1 (paginated history), ?id=6 (empty history), ?id=2 (Duplicate
  Candidate banner, no Akun Pasien).
-->

</style>
</head>

<script>
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
function initials(name) { return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function fmtDate(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '<span class="text-slate-400 italic">belum diisi</span>'; }
function fmtDateTime(iso) { return new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }

function mkAddress(street, kelurahan, kecamatan, kota, provinsi, kodePos, lat, lng, placeId) {
  return { street, kelurahan, kecamatan, kota, provinsi, kodePos, lat, lng, placeId,
    formatted: `${street}, ${kelurahan}, ${kecamatan}, ${kota}, ${provinsi} ${kodePos}` };
}
function emptyAddress() { return { street: '', kelurahan: '', kecamatan: '', kota: '', provinsi: '', kodePos: '', lat: null, lng: null, placeId: null, formatted: '' }; }

    account: { email: 'siti.rahma@example.com', lastLoginAt: '2026-08-18T09:24:00', passwordExpiresAt: '2026-09-03' } },
  { id: 2, name: 'Budi Santoso', gender: 'L', phone: '081298765432', nik: null, dob: '1985-11-03', address: mkAddress('Jl. Kenanga No. 5', 'Cihapit', 'Bandung Wetan', 'Bandung', 'Jawa Barat', '40114', -6.9034, 107.6156, 'place_kenanga_5'), akunPasien: false, visits: [], duplicateOf: 3, account: null },
  { id: 3, name: 'Budi Santosa', gender: 'L', phone: '081298765431', nik: null, dob: '1985-11-03', address: mkAddress('Jl. Kenanga No. 5', 'Cihapit', 'Bandung Wetan', 'Bandung', 'Jawa Barat', '40114', -6.9034, 107.6156, 'place_kenanga_5'), akunPasien: false, visits: [

    { date: '2026-05-22', layanan: 'Pemeriksaan Umum', dokter: 'dr. Citra Dewi', status: 'completed' },
  ], account: null },

function byId(id) { return PATIENTS_DB.find(p => p.id === id) || null; }
function genderLabel(g) { return g === 'P' ? 'Perempuan' : 'Laki-laki'; }
function statusPill(status) {
  const map = { completed: 'bg-emerald-100 text-emerald-700', confirmed: 'bg-blue-100 text-blue-700', 'no-show': 'bg-red-100 text-red-700', cancelled: 'bg-slate-100 text-slate-500', rescheduled: 'bg-amber-100 text-amber-700' };
  return `<span class="text-[11px] px-1.5 py-0.5 rounded ${map[status] || 'bg-slate-100 text-slate-500'}">${esc(status)}</span>`;
}

const PAGE_SIZE = 10;
const currentId = Number(new URLSearchParams(location.search).get('id')) || null;

let ui = { editing: false, editDraft: null, addressSearch: '', visitPage: 1 };

// ---------------------------------------------------------------------------
// Section 1 — Profil
// ---------------------------------------------------------------------------
function addressSearchBlock() {
  const q = ui.addressSearch.trim();
  const suggestions = q.length >= 3 ? ADDRESS_SUGGESTIONS.filter(s => s.formatted.toLowerCase().includes(q.toLowerCase())) : [];
  const addr = ui.editDraft.address;
  return `<div class="space-y-2">
    <div class="relative">
      <input data-bind="addressSearch" value="${esc(ui.addressSearch)}" placeholder="Cari alamat (Google Maps)..." class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
      ${suggestions.length ? `<div data-anim="in" class="absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-md shadow-lg z-10 max-h-48 overflow-y-auto">
        ${suggestions.map(s => `<div data-action="pick-address" data-place-id="${s.placeId}" class="cursor-pointer px-3 py-2 text-sm hover:bg-blue-50 border-b border-slate-100 last:border-0">📍 ${esc(s.formatted)}</div>`).join('')}
      </div>` : ''}
    </div>
    ${addr ? `<div class="grid grid-cols-2 gap-2 bg-slate-50 border border-slate-200 rounded-md p-3">
      <label class="block text-xs text-slate-400 col-span-2">Jalan<input data-bind="address.street" value="${esc(addr.street)}" class="mt-0.5 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></label>
      <label class="block text-xs text-slate-400">Kelurahan<input data-bind="address.kelurahan" value="${esc(addr.kelurahan)}" class="mt-0.5 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></label>
      <label class="block text-xs text-slate-400">Kecamatan<input data-bind="address.kecamatan" value="${esc(addr.kecamatan)}" class="mt-0.5 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></label>
      <label class="block text-xs text-slate-400">Kota/Kabupaten<input data-bind="address.kota" value="${esc(addr.kota)}" class="mt-0.5 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></label>
      <label class="block text-xs text-slate-400">Provinsi<input data-bind="address.provinsi" value="${esc(addr.provinsi)}" class="mt-0.5 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></label>
      <label class="block text-xs text-slate-400">Kode Pos<input data-bind="address.kodePos" value="${esc(addr.kodePos)}" class="mt-0.5 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></label>
    </div>` : `<button data-action="manual-address" class="text-xs text-blue-600 underline">+ Isi alamat manual (tanpa pencarian)</button>`}
  </div>`;
}

function addressLines(addr) {
  if (!addr || !addr.street) return '<span class="text-slate-400 italic">belum diisi</span>';
  return `<div>${esc(addr.street)}</div>
    <div class="text-xs text-slate-500">${esc(addr.kelurahan || '-')}, ${esc(addr.kecamatan || '-')}</div>
    <div class="text-xs text-slate-500">${esc(addr.kota || '-')}, ${esc(addr.provinsi || '-')} ${esc(addr.kodePos || '')}</div>`;
}

function renderProfilSection(p) {
  if (ui.editing) {
    const d = ui.editDraft;
    return `<div class="grid grid-cols-2 gap-4">
      <label class="block text-xs text-slate-500">Nama<input data-bind="name" value="${esc(d.name)}" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" /></label>
      <label class="block text-xs text-slate-500">Telepon<input data-bind="phone" value="${esc(d.phone)}" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" /></label>
      <label class="block text-xs text-slate-500">NIK <span class="text-slate-400">(opsional)</span><input data-bind="nik" value="${esc(d.nik)}" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-400" /></label>
      <label class="block text-xs text-slate-500">Tgl Lahir<input data-bind="dob" type="date" value="${esc(d.dob)}" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" /></label>
      <label class="block text-xs text-slate-500">Jenis Kelamin<select data-bind="gender" class="mt-1 w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"><option value="L" ${d.gender === 'L' ? 'selected' : ''}>Laki-laki</option><option value="P" ${d.gender === 'P' ? 'selected' : ''}>Perempuan</option></select></label>
      <div class="col-span-2">
        <div class="text-xs text-slate-500 mb-1">Alamat</div>
        ${addressSearchBlock()}
      </div>
    </div>
    <div class="flex gap-2 mt-4">
      <button data-action="save-edit" class="text-sm bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Simpan</button>
      <button data-action="cancel-edit" class="text-sm text-slate-500 underline">Batal</button>
    </div>`;
  }
  return `<div class="grid grid-cols-2 gap-y-2 text-sm">
    <div class="text-slate-400">Telepon</div><div>${esc(p.phone)}</div>
    <div class="text-slate-400">NIK</div><div class="font-mono">${p.nik ? esc(p.nik) : '<span class="text-slate-400 italic">belum diisi</span>'}</div>
    <div class="text-slate-400">Tgl Lahir</div><div>${fmtDate(p.dob)}</div>
    <div class="text-slate-400">Jenis Kelamin</div><div>${genderLabel(p.gender)}</div>
    <div class="text-slate-400">Alamat</div><div>${addressLines(p.address)}</div>
  </div>
  <button data-action="start-edit" class="mt-4 text-sm bg-slate-800 text-white px-4 py-2 rounded-md hover:bg-slate-900">Edit data</button>`;
}

// ---------------------------------------------------------------------------
// Section 2 — Riwayat Kunjungan (sorted desc, 10/page)
// ---------------------------------------------------------------------------
function renderRiwayatSection(p) {
  if (!p.visits.length) return `<div class="text-sm text-slate-400 italic">Belum ada riwayat kunjungan.</div>`;
  const sorted = p.visits.slice().sort((a, b) => b.date.localeCompare(a.date));
  const totalPages = Math.ceil(sorted.length / PAGE_SIZE);
  const page = Math.min(ui.visitPage, totalPages);
  const pageItems = sorted.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  return `<div class="space-y-2">${pageItems.map(v => `
    <div class="flex items-center justify-between border border-slate-200 rounded-md px-3 py-2 text-sm">
      <div><div class="font-medium">${esc(v.layanan)}</div><div class="text-xs text-slate-500">${fmtDate(v.date)} · ${esc(v.dokter)}</div></div>
      ${statusPill(v.status)}
    </div>`).join('')}</div>
  ${totalPages > 1 ? `<div class="flex items-center justify-between mt-3 text-xs text-slate-500">
    <button data-action="visit-prev" ${page <= 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-md border border-slate-300 ${page <= 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-50'}">← Sebelumnya</button>
    <span>Halaman ${page} dari ${totalPages} · ${sorted.length} kunjungan total</span>
    <button data-action="visit-next" ${page >= totalPages ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-md border border-slate-300 ${page >= totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-50'}">Berikutnya →</button>
  </div>
  <div class="text-[11px] text-slate-400 mt-1">Menampilkan 10 kunjungan terakhir per halaman — di aplikasi nyata ini server-side pagination, bukan potongan array di klien.</div>` : ''}`;
}

// ---------------------------------------------------------------------------
// Section 3 — Akun Pasien
// ---------------------------------------------------------------------------
function passwordExpiryNote(expiresAt) {
  const days = Math.round((new Date(expiresAt) - new Date('2026-08-22')) / 86400000);
  if (days < 0) return `<span class="text-red-600">Kadaluarsa ${Math.abs(days)} hari lalu (${fmtDate(expiresAt)})</span>`;
  if (days <= 7) return `<span class="text-amber-600">Kadaluarsa dalam ${days} hari (${fmtDate(expiresAt)})</span>`;
  return `<span class="text-slate-700">Kadaluarsa ${fmtDate(expiresAt)} (${days} hari lagi)</span>`;
}

function renderAkunSection(p) {
  if (!p.akunPasien || !p.account) {
    return `<div class="text-sm text-slate-500">Pasien ini belum memiliki Akun Pasien — belum pernah login sendiri. Data dicatat oleh Resepsionis dari panggilan telepon atau kunjungan langsung.</div>`;
  }
  const a = p.account;
  return `<div class="grid grid-cols-2 gap-y-2 text-sm">
    <div class="text-slate-400">Email</div><div>${esc(a.email)}</div>
    <div class="text-slate-400">Terakhir Login</div><div>${a.lastLoginAt ? fmtDateTime(a.lastLoginAt) : '<span class="text-slate-400 italic">Belum pernah login</span>'}</div>
    <div class="text-slate-400">Password</div><div>${passwordExpiryNote(a.passwordExpiresAt)}</div>
  </div>
  <div class="text-[11px] text-slate-400 mt-3">⚠ Prototipe saja — CONTEXT.md mendefinisikan Akun Pasien sebagai kredensial nomor telepon + OTP, bukan email/password. Field di atas mengikuti feedback UI, perlu dikonfirmasi ke domain model sebelum diimplementasikan.</div>`;
}

// ---------------------------------------------------------------------------
// Page shell
// ---------------------------------------------------------------------------
function duplicateBanner(p) {
  if (!p.duplicateOf) return '';
  const other = byId(p.duplicateOf);
  return `<div class="border border-amber-300 bg-amber-50 rounded-lg p-3 text-xs mb-4">
    ⚠ <strong>Duplicate Candidate</strong> — kemungkinan sama dengan <strong>${esc(other.name)}</strong> (${esc(other.phone)}). Tidak digabung otomatis (bukan match NIK) — tinjau lewat halaman Patient Management.
  </div>`;
}

function render() {
  const p = byId(currentId);
  const app = document.getElementById('app');
  if (!p) {
    app.innerHTML = `<div class="max-w-xl mx-auto pt-16 px-4 text-center">
      <div class="text-sm text-slate-500 mb-3">Pasien tidak ditemukan${currentId ? ` (id=${currentId})` : ''}.</div>
      <a href="patient-management.prototype.html?variant=A" class="text-sm text-blue-700 underline">← Kembali ke Daftar Pasien</a>
    </div>`;
    return;
  }
  app.innerHTML = `<div class="max-w-3xl mx-auto pt-8 px-4 pb-16">
    <a href="patient-management.prototype.html?variant=A" class="text-xs text-slate-500 underline">← Kembali ke Daftar Pasien</a>
    <div class="flex items-center gap-3 mt-3 mb-1">
      <div class="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center text-lg">${initials(p.name)}</div>
      <div><h1 class="text-xl font-semibold">${esc(p.name)}</h1><div class="text-xs text-slate-400">Pasien #${p.id} · ${genderLabel(p.gender)}</div></div>
    </div>
    <nav class="flex gap-4 text-xs text-blue-700 my-4">
      <a href="#section-profil">Profil</a><a href="#section-riwayat">Riwayat Kunjungan</a><a href="#section-akun">Akun Pasien</a>
    </nav>
    ${duplicateBanner(p)}

    <div id="section-profil" class="bg-white rounded-xl border border-slate-200 p-5 mb-4">
      <div class="text-sm font-semibold mb-3">1. Profil</div>
      ${renderProfilSection(p)}
    </div>

    <div id="section-riwayat" class="bg-white rounded-xl border border-slate-200 p-5 mb-4">
      <div class="text-sm font-semibold mb-3">2. Riwayat Kunjungan</div>
      ${renderRiwayatSection(p)}
    </div>

    <div id="section-akun" class="bg-white rounded-xl border border-slate-200 p-5">
      <div class="text-sm font-semibold mb-3">3. Akun Pasien</div>
      ${renderAkunSection(p)}
    </div>
  </div>`;
}

function applyBind(e) {
  const bind = e.target.dataset.bind;
  if (!bind) return;
  const parts = bind.split('.');
  if (parts[0] === 'address') ui.editDraft.address[parts[1]] = e.target.value;
  else if (bind === 'addressSearch') ui.addressSearch = e.target.value;
  else ui.editDraft[bind] = e.target.value;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const p = byId(currentId);
  switch (t.dataset.action) {
    case 'start-edit':
      ui.editing = true; ui.addressSearch = '';
      ui.editDraft = { name: p.name, phone: p.phone, nik: p.nik || '', dob: p.dob, gender: p.gender, address: p.address ? { ...p.address } : null };
      break;
    case 'cancel-edit': ui.editing = false; ui.editDraft = null; break;
    case 'save-edit':
      p.name = ui.editDraft.name; p.phone = ui.editDraft.phone; p.nik = ui.editDraft.nik || null;
      p.dob = ui.editDraft.dob; p.gender = ui.editDraft.gender; p.address = ui.editDraft.address;
      ui.editing = false; ui.editDraft = null;
      break;
    case 'pick-address': {
      const s = ADDRESS_SUGGESTIONS.find(a => a.placeId === t.dataset.placeId);
      if (s) ui.editDraft.address = { ...s };
      ui.addressSearch = '';
      break;
    }
    case 'manual-address': ui.editDraft.address = emptyAddress(); break;
    case 'visit-prev': ui.visitPage = Math.max(1, ui.visitPage - 1); break;
    case 'visit-next': ui.visitPage = ui.visitPage + 1; break;
  }
  render();
});

document.addEventListener('input', (e) => {
  if (!e.target.dataset.bind || e.target.tagName === 'SELECT') return;
  applyBind(e);
  const bind = e.target.dataset.bind;
  const selStart = e.target.selectionStart, selEnd = e.target.selectionEnd;
  render();
  const el = document.querySelector(`[data-bind="${bind}"]`);
  if (el && el.type !== 'date') { el.focus(); el.setSelectionRange(selStart, selEnd); }
  else if (el) el.focus();
});

document.addEventListener('change', (e) => {
  if (!e.target.dataset.bind || e.target.tagName !== 'SELECT') return;
  applyBind(e);
  render();
});

render();
</script>
</body>
</html>
