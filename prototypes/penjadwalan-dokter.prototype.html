<title>PROTOTYPE — Penjadwalan Dokter</title>
<!--
  PROTOTYPE — throwaway code, do not build on top of this directly.

  Question: what should the Admin Klinik screen for managing a Dokter's
  Penjadwalan (weekly Jadwal template + one-off Pengecualian Jadwal, story
  #12/#13 on issue #1) actually look like? Three structurally different
  layouts were tried: A (month-calendar-first, day drawer), B (weekly
  hour x day grid + exception list), C (dokter roster + dense table with
  bulk date-range cuti).

  VERDICT: B wins — the recurring weekly template is the thing an Admin
  Klinik edits most often, so making it the primary object (rather than a
  calendar or a dense table) reads best. A and C are removed; only B's
  layout remains, extended per feedback across two review rounds:
  - a Minggu/Bulan view toggle. Bulan reuses A's calendar-cell idea
    (effective hours/cuti/jam khusus color-coded per day) as an overview;
    Minggu keeps the hour x day grid for actually editing the template.
  - week/month navigation (‹ ›) plus a "Hari ini" button.
  - day columns/headers show the actual date, not just the day name.
  - past days, past schedule blocks, and past Pengecualian are greyed out
    and read-only — a Jadwal edit or Pengecualian only ever applies from
    today onward, never retroactively to a week/date that's already gone.
  - Cuti is requested as a date range (dari/sampai, reusing the
    TAMBAH_CUTI_RENTANG action C introduced), not a single date.
  - the dokter picker is a horizontally-scrolling slider, not a wrapping
    pill row — the seed roster is 8 dokter to make that need visible.
  - Pengecualian Jadwal + Cuti moved to their own page (tab), separate
    from the working Jadwal view: that list grows large over time and
    audit needs to see past entries, which don't belong cluttering the
    day-to-day scheduling screen. It gets its own Semua/Mendatang/Riwayat
    filter so history stays reachable instead of getting silently dropped,
    and — since audit means seeing every dokter, not just whichever one
    happens to be selected — the list spans all dokter with a Dokter
    column; only the "Ajukan Pengecualian" form stays scoped to the
    selected dokter.
  - the Jadwal page no longer shows a detailed upcoming-appointment list;
    the goal there is just "does this date already have a patient
    booked", not who/when. Minggu shows an "N appt" badge per day header
    plus a small dot on the specific occupied hour cell(s) in the grid;
    Bulan already had a per-day count badge (recolored to match). The
    "tandai tiba (demo)" affordance needed to exercise the ADR-0018
    blocked-conflict scenario moved into its own small collapsible panel
    (bottom-right) alongside the action log — it's test tooling, not part
    of the design being evaluated.

  That's all UI-only. The underlying conflict-handling logic (what happens
  to a confirmed Appointment orphaned by an edit — force-with-reason, or
  refused outright if the patient already arrived) was already built and
  validated separately in docs/prototypes/jadwal-dokter.prototype.html and
  fed into ADR-0018; it's reused as-is here (see ScheduleModel below), not
  re-tested.

  UPDATE (post ADR-0022): a Jadwal block now names the Layanan it's for
  (a Dokter can be eligible for more than one Layanan, e.g. a pediatrician
  who also does Konsultasi Umum). Adding a block is rejected outright —
  no force-with-reason override, unlike ADR-0018's Appointment-orphaning
  flow — in two cases: it overlaps one of the same Dokter's own blocks
  (already existed), or it overlaps another Dokter's block for the *same*
  Layanan (new: a Layanan is a single exclusive resource, so two Dokter
  can never hold it at once). Only Jadwal blocks got this treatment here;
  Jam Khusus overrides don't carry a Layanan yet in this prototype — a
  known gap, not a re-litigation of ADR-0022 (which says Jam Khusus should
  eventually get the same treatment).

  No backend, no persistence — state lives in memory and resets on reload.
  Run: open this file directly in a browser (double-click / File > Open),
  or serve the folder (python3 -m http.server) if your browser/extension
  blocks file:// URLs.
-->

<script id="schedule-model">
/* ---- LOGIC MURNI (dipakai ulang dari docs/prototypes/jadwal-dokter.prototype.html / ADR-0018) ----
   Tidak ada DOM di sini. Ini bagian yang sudah tervalidasi; prototype ini
   TIDAK menguji ulang model ini, hanya menguji tampilannya. */
const ScheduleModel = (() => {
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const HARI_TAMPIL = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
  const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  function menit(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
  function hhmm(t) { const h = Math.floor(t / 60).toString().padStart(2, '0'); const m = (t % 60).toString().padStart(2, '0'); return `${h}:${m}`; }

  function keTanggalISOLokal(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function nextWeekday(targetDay, fromISO) {
    const d = fromISO ? new Date(fromISO + 'T00:00:00') : new Date();
    const diff = (targetDay - d.getDay() + 7) % 7 || 7;
    d.setDate(d.getDate() + diff);
    return keTanggalISOLokal(d);
  }
  function addDays(iso, n) {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return keTanggalISOLokal(d);
  }
  function hariDariTanggal(iso) {
    return HARI[new Date(iso + 'T00:00:00').getDay()];
  }
  function formatTanggalIndo(iso) {
    const d = new Date(iso + 'T00:00:00');
    return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  }
  function bulanKe(monthStr, delta) {
    const [y, m] = monthStr.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  function labelBulan(monthStr) {
    const [y, m] = monthStr.split('-').map(Number);
    return `${BULAN[m - 1]} ${y}`;
  }
  function selDalamBulan(monthStr) {
    const [y, m] = monthStr.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const daysInMonth = new Date(y, m, 0).getDate();
    const offset = (first.getDay() + 6) % 7; // Monday-start
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
    return cells;
  }

  function jendelaEfektif(state, dokterId, tanggalISO) {
    const hari = hariDariTanggal(tanggalISO);
    const jamOp = state.jamOperasional[hari];
    const pengecualian = (state.pengecualian[dokterId] || []).find(p => p.tanggal === tanggalISO);

    if (pengecualian && pengecualian.tipe === 'cuti') {
      return { jendela: [], alasanKosong: 'Dokter cuti (Pengecualian Jadwal) pada tanggal ini.' };
    }
    if (!jamOp) {
      return { jendela: [], alasanKosong: `Klinik tutup pada hari ${hari} (Jam Operasional).` };
    }
    let mentah;
    if (pengecualian && pengecualian.tipe === 'jam_khusus') {
      mentah = [{ mulai: pengecualian.mulai, selesai: pengecualian.selesai }];
    } else {
      mentah = (state.jadwal[dokterId] || []).filter(b => b.hari === hari).map(b => ({ mulai: b.mulai, selesai: b.selesai }));
    }
    const jendela = mentah
      .map(w => ({
        mulai: hhmm(Math.max(menit(w.mulai), menit(jamOp.buka))),
        selesai: hhmm(Math.min(menit(w.selesai), menit(jamOp.tutup))),
      }))
      .filter(w => menit(w.mulai) < menit(w.selesai));
    if (jendela.length === 0) {
      return { jendela: [], alasanKosong: 'Tidak ada jam dokter yang tumpang tindih dengan jam operasional klinik pada tanggal ini.' };
    }
    return { jendela, alasanKosong: null };
  }

  function waktuMasihTersedia(state, dokterId, tanggalISO, mulai, selesai) {
    const { jendela } = jendelaEfektif(state, dokterId, tanggalISO);
    return jendela.some(w => menit(w.mulai) <= menit(mulai) && menit(selesai) <= menit(w.selesai));
  }

  function cariAppointmentBentrok(stateBaru, stateLama, dokterId) {
    return (stateLama.appointments[dokterId] || []).filter(
      a => a.status === 'confirmed' && !waktuMasihTersedia(stateBaru, dokterId, a.tanggal, a.mulai, a.selesai)
    );
  }

  return {
    HARI, HARI_TAMPIL, BULAN, menit, hhmm, keTanggalISOLokal, nextWeekday, addDays,
    hariDariTanggal, formatTanggalIndo, bulanKe, labelBulan, selDalamBulan,
    jendelaEfektif, waktuMasihTersedia, cariAppointmentBentrok,
  };
})();
</script>

<script>
/* ---- Halaman (throwaway): seed data, reducer, dan render halaman Penjadwalan Dokter ---- */
const { HARI, HARI_TAMPIL, BULAN, menit, hhmm, keTanggalISOLokal, addDays, nextWeekday, hariDariTanggal, formatTanggalIndo, bulanKe, labelBulan, selDalamBulan, jendelaEfektif, cariAppointmentBentrok } = ScheduleModel;

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const TODAY_ISO = keTanggalISOLokal(new Date());
const TGL_SENIN = nextWeekday(1);
const TGL_SELASA = nextWeekday(2);
const TGL_RABU = nextWeekday(3);
const TGL_JUMAT = nextWeekday(5);

function seedAwal() {
  return {
    dokter: [
      { id: 'd1', nama: 'dr. Amelia Putri', spesialisasi: 'Umum' },
      { id: 'd2', nama: 'dr. Bagus Santoso', spesialisasi: 'Gigi' },
      { id: 'd3', nama: 'dr. Citra Dewi', spesialisasi: 'Fisioterapi' },
      { id: 'd4', nama: 'dr. Dimas Wijaya', spesialisasi: 'Anak' },
      { id: 'd5', nama: 'dr. Rina Hartono', spesialisasi: 'Mata' },
      { id: 'd6', nama: 'dr. Yusuf Hakim', spesialisasi: 'THT' },
      { id: 'd7', nama: 'dr. Maya Kusuma', spesialisasi: 'Kulit & Kelamin' },
      { id: 'd8', nama: 'dr. Hendra Saputra', spesialisasi: 'Jantung' },
    ],
    jamOperasional: {

      Rabu: { buka: '08:00', tutup: '17:00' }, Kamis: { buka: '08:00', tutup: '17:00' },
      Jumat: { buka: '08:00', tutup: '17:00' }, Sabtu: { buka: '08:00', tutup: '12:00' }, Minggu: null,
    },
    // Setiap Layanan hanya untuk satu dokter dalam satu waktu (ADR-0022) — dokterIds di sini
    // cuma daftar dokter yang ELIGIBLE, bukan jaminan mereka boleh praktik bersamaan.
    layanan: [
      { id: 'l1', nama: 'Konsultasi Umum', dokterIds: ['d1', 'd4'] },
      { id: 'l2', nama: 'Gigi', dokterIds: ['d2'] },
      { id: 'l3', nama: 'Fisioterapi', dokterIds: ['d3'] },
      { id: 'l4', nama: 'Anak', dokterIds: ['d4'] },
      { id: 'l5', nama: 'Mata', dokterIds: ['d5'] },
      { id: 'l6', nama: 'THT', dokterIds: ['d6'] },
      { id: 'l7', nama: 'Kulit & Kelamin', dokterIds: ['d7'] },
      { id: 'l8', nama: 'Jantung', dokterIds: ['d8'] },
    ],
    jadwal: {
      d1: [
        { id: 'j1', hari: 'Senin', layananId: 'l1', mulai: '08:00', selesai: '12:00' },
        { id: 'j2', hari: 'Senin', layananId: 'l1', mulai: '13:00', selesai: '16:00' },
        { id: 'j3', hari: 'Rabu', layananId: 'l1', mulai: '08:00', selesai: '12:00' },
        { id: 'j4', hari: 'Jumat', layananId: 'l1', mulai: '08:00', selesai: '12:00' },
      ],
      d2: [
        { id: 'j5', hari: 'Selasa', layananId: 'l2', mulai: '09:00', selesai: '15:00' },
        { id: 'j6', hari: 'Kamis', layananId: 'l2', mulai: '09:00', selesai: '15:00' },
      ],
      d3: [
        { id: 'j7', hari: 'Senin', layananId: 'l3', mulai: '13:00', selesai: '17:00' },
        { id: 'j8', hari: 'Rabu', layananId: 'l3', mulai: '13:00', selesai: '17:00' },
        { id: 'j9', hari: 'Jumat', layananId: 'l3', mulai: '13:00', selesai: '17:00' },
      ],
      d4: [], d5: [], d6: [], d7: [], d8: [],
    },
    pengecualian: { d1: [], d2: [], d3: [], d4: [], d5: [], d6: [], d7: [], d8: [] },
    appointments: {
      d1: [
        { id: 'a1', tanggal: TGL_SENIN, mulai: '09:00', selesai: '09:30', pasien: 'Budi Santoso', status: 'confirmed', visitStatus: 'belum-tiba' },
        { id: 'a2', tanggal: TGL_RABU, mulai: '09:00', selesai: '09:30', pasien: 'Sari Amalia', status: 'confirmed', visitStatus: 'menunggu' },
      ],
      d2: [
        { id: 'a3', tanggal: TGL_SELASA, mulai: '10:00', selesai: '10:30', pasien: 'Joko Prasetyo', status: 'confirmed', visitStatus: 'belum-tiba' },
      ],
      d3: [
        { id: 'a4', tanggal: TGL_JUMAT, mulai: '14:00', selesai: '14:30', pasien: 'Nina Kartika', status: 'confirmed', visitStatus: 'belum-tiba' },
      ],
      d4: [], d5: [], d6: [], d7: [], d8: [],
    },
    selectedDokter: 'd1',
    pendingKonflik: null,
    log: [{ level: 'info', text: 'Kondisi awal dimuat: 8 dokter, 3 di antaranya sudah punya jadwal rutin dan appointment terkonfirmasi.' }],
  };
}

function withLog(state, level, text) {
  return { ...state, log: [...state.log, { level, text }] };
}

function terapkanDenganCekKonflik(state, dokterId, aksiLabel, buatStateHipotesis, action) {
  const { paksa, alasan } = action;
  const hipotesis = buatStateHipotesis(state);
  const konflik = cariAppointmentBentrok(hipotesis, state, dokterId);
  const terblokir = konflik.filter(a => a.visitStatus !== 'belum-tiba');

  if (terblokir.length > 0) {
    return withLog(
      { ...state, pendingKonflik: { dokterId, aksiLabel, appointments: konflik, blocked: true, rawAction: action } },
      'error',
      `✗ "${aksiLabel}" ditolak total — pasien sudah tiba (${terblokir.map(a => `${a.pasien}: ${a.visitStatus}`).join(', ')}). Ubah lewat back-office tidak masuk akal lagi, tangani langsung di klinik.`
    );
  }
  if (konflik.length > 0 && !paksa) {
    return withLog(
      { ...state, pendingKonflik: { dokterId, aksiLabel, appointments: konflik, blocked: false, rawAction: action } },
      'warn',
      `⚠️ "${aksiLabel}" ditunda — ${konflik.length} appointment akan kehilangan slotnya. Menunggu keputusan admin.`
    );
  }
  if (konflik.length > 0 && paksa && !(alasan || '').trim()) {
    return { ...state, pendingKonflik: { dokterId, aksiLabel, appointments: konflik, blocked: false, rawAction: action } };
  }
  let hasil = hipotesis;
  if (konflik.length > 0) {
    const idSet = new Set(konflik.map(a => a.id));
    hasil = { ...hipotesis, appointments: { ...hipotesis.appointments, [dokterId]: hipotesis.appointments[dokterId].map(a => idSet.has(a.id) ? { ...a, status: 'perlu_dijadwal_ulang' } : a) } };
  }
  return withLog(
    { ...hasil, pendingKonflik: null },
    'info',
    konflik.length > 0
      ? `✓ ${aksiLabel}. ${konflik.length} appointment ditandai "perlu dijadwal ulang" (tidak dihapus diam-diam) — alasan: "${alasan.trim()}".`
      : `✓ ${aksiLabel}`
  );
}

function reduce(state, action) {
  switch (action.type) {
    case 'SELECT_DOKTER':
      // Jangan bersihkan pendingKonflik di sini: sejak Pengecualian & Cuti menampilkan
      // semua dokter untuk audit, sebuah konflik yang belum diselesaikan bisa jadi bukan
      // untuk dokter yang baru dipilih — pindah dokter di slider tidak boleh diam-diam
      // membatalkan keputusan admin yang belum selesai (lihat konflikJadwal/konflikPengecualian
      // di renderHalaman, yang sudah menyaring berdasarkan dokter & jenis aksi masing-masing).
      return { ...state, selectedDokter: action.dokterId };

    case 'TAMBAH_BLOK': {
      const { dokterId, hari, layananId, mulai, selesai } = action;
      if (menit(mulai) >= menit(selesai)) return withLog(state, 'error', `Blok ${hari} ${mulai}–${selesai} ditolak: jam mulai harus sebelum jam selesai.`);
      if (!layananId) return withLog(state, 'error', `Blok ${hari} ${mulai}–${selesai} ditolak: pilih Layanan untuk blok ini.`);
      const existing = state.jadwal[dokterId] || [];
      const tumpangSendiri = existing.find(b => b.hari === hari && menit(b.mulai) < menit(selesai) && menit(mulai) < menit(b.selesai));
      if (tumpangSendiri) return withLog(state, 'error', `Blok ${hari} ${mulai}–${selesai} ditolak: tumpang tindih dengan blok ${dokterById(dokterId).nama} sendiri yang sudah ada (${tumpangSendiri.mulai}–${tumpangSendiri.selesai}).`);
      const tumpangLayanan = cariBlokLayananTumpang(state, dokterId, layananId, hari, mulai, selesai);
      if (tumpangLayanan) {
        const dokterLain = dokterById(tumpangLayanan.dokterId);
        return withLog(state, 'error', `Blok ${hari} ${mulai}–${selesai} ditolak: ${layananById(layananId).nama} sudah dipakai ${dokterLain.nama} pada jam yang sama (${tumpangLayanan.mulai}–${tumpangLayanan.selesai}) — satu Layanan hanya untuk satu dokter dalam satu waktu (ADR-0022), tidak bisa dipaksakan.`);
      }
      const blok = { id: 'j' + Math.random().toString(36).slice(2, 8), hari, layananId, mulai, selesai };
      return withLog({ ...state, jadwal: { ...state.jadwal, [dokterId]: [...existing, blok] } }, 'info', `Blok jadwal ditambahkan: ${hari} ${mulai}–${selesai} (${layananById(layananId).nama}).`);
    }

    case 'HAPUS_BLOK': {
      const { dokterId, blokId } = action;
      const blok = (state.jadwal[dokterId] || []).find(b => b.id === blokId);
      if (!blok) return state;
      return terapkanDenganCekKonflik(state, dokterId, `Hapus blok jadwal ${blok.hari} ${blok.mulai}–${blok.selesai}`,
        s => ({ ...s, jadwal: { ...s.jadwal, [dokterId]: s.jadwal[dokterId].filter(b => b.id !== blokId) } }), action);
    }

    case 'TAMBAH_PENGECUALIAN': {
      const { dokterId, tanggal, tipe, mulai, selesai } = action;
      if (tanggal < TODAY_ISO) return withLog(state, 'error', `Pengecualian untuk ${tanggal} ditolak: tanggal sudah lewat, hanya bisa untuk hari ini atau setelahnya.`);
      const existing = state.pengecualian[dokterId] || [];
      if (existing.some(p => p.tanggal === tanggal)) return withLog(state, 'error', `Pengecualian untuk ${tanggal} ditolak: sudah ada pengecualian pada tanggal ini.`);
      if (tipe === 'jam_khusus' && menit(mulai) >= menit(selesai)) return withLog(state, 'error', 'Pengecualian jam khusus ditolak: jam mulai harus sebelum jam selesai.');
      const label = tipe === 'cuti' ? `Tambah cuti ${tanggal}` : `Tambah jam khusus ${tanggal} (${mulai}–${selesai})`;
      return terapkanDenganCekKonflik(state, dokterId, label,
        s => ({ ...s, pengecualian: { ...s.pengecualian, [dokterId]: [...(s.pengecualian[dokterId] || []), { id: 'p' + Math.random().toString(36).slice(2, 8), tanggal, tipe, mulai: tipe === 'jam_khusus' ? mulai : null, selesai: tipe === 'jam_khusus' ? selesai : null }] } }), action);
    }

    case 'HAPUS_PENGECUALIAN': {
      const { dokterId, id } = action;
      const p = (state.pengecualian[dokterId] || []).find(x => x.id === id);
      if (!p) return state;
      if (p.tanggal < TODAY_ISO) return withLog(state, 'error', `Pengecualian ${p.tanggal} sudah lewat dan tidak bisa diubah.`);
      return terapkanDenganCekKonflik(state, dokterId, `Hapus pengecualian ${p.tanggal}`,
        s => ({ ...s, pengecualian: { ...s.pengecualian, [dokterId]: s.pengecualian[dokterId].filter(x => x.id !== id) } }), action);
    }

    case 'TAMBAH_CUTI_RENTANG': {
      const { dokterId, dari, sampai } = action;
      if (!dari || !sampai) return withLog(state, 'error', 'Tanggal mulai dan selesai cuti wajib diisi.');
      if (dari < TODAY_ISO) return withLog(state, 'error', 'Tanggal mulai cuti sudah lewat — cuti hanya bisa diajukan untuk hari ini atau setelahnya.');
      if (dari > sampai) return withLog(state, 'error', 'Tanggal mulai cuti harus sebelum atau sama dengan tanggal selesai.');
      const list = [];
      for (let cur = dari; cur <= sampai; cur = addDays(cur, 1)) { list.push(cur); if (list.length > 31) break; }
      if (list.length > 31) return withLog(state, 'error', 'Rentang cuti maksimum 31 hari untuk prototype ini.');
      const existing = state.pengecualian[dokterId] || [];
      const dilewati = list.filter(t => existing.some(p => p.tanggal === t));
      const label = `Ajukan cuti ${dari} s/d ${sampai} (${list.length} hari${dilewati.length ? `, ${dilewati.length} tanggal dilewati karena sudah ada pengecualian` : ''})`;
      return terapkanDenganCekKonflik(state, dokterId, label,
        s => ({
          ...s,
          pengecualian: {
            ...s.pengecualian,
            [dokterId]: [
              ...existing,
              ...list.filter(t => !existing.some(p => p.tanggal === t)).map(t => ({ id: 'p' + Math.random().toString(36).slice(2, 8), tanggal: t, tipe: 'cuti', mulai: null, selesai: null })),
            ],
          },
        }), action);
    }

    case 'LANJUTKAN_PAKSA': {
      if (!state.pendingKonflik) return state;
      return reduce(state, { ...state.pendingKonflik.rawAction, paksa: true, alasan: action.alasan });
    }

    case 'BATALKAN_KONFLIK':
      return withLog({ ...state, pendingKonflik: null }, 'info', '↩ Perubahan dibatalkan oleh admin, tidak ada appointment yang terdampak.');

    case 'TANDAI_TIBA_DEMO': {
      const { dokterId, apptId } = action;
      const appt = (state.appointments[dokterId] || []).find(a => a.id === apptId);
      if (!appt) return state;
      return withLog(
        { ...state, appointments: { ...state.appointments, [dokterId]: state.appointments[dokterId].map(a => a.id === apptId ? { ...a, visitStatus: 'menunggu' } : a) } },
        'info', `(demo) ${appt.pasien} ditandai sudah tiba di klinik — coba edit jadwal yang mengenai slot ini sekarang.`
      );
    }

    default:
      return state;
  }
}

// ---------- tanggal & minggu helpers (halaman) ----------

function mondayOfWeek(iso) {
  const d = new Date(iso + 'T00:00:00');
  const dow = d.getDay(); // 0=Minggu..6=Sabtu
  const deltaKeSenin = dow === 0 ? -6 : 1 - dow;
  return addDays(iso, deltaKeSenin);
}
function tanggalUntukHari(weekStart, hari) {
  return addDays(weekStart, HARI_TAMPIL.indexOf(hari));
}
function labelTanggalPendek(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${BULAN[d.getMonth()]}`;
}
function labelRentangMinggu(weekStart) {
  const end = addDays(weekStart, 6);
  const d1 = new Date(weekStart + 'T00:00:00');
  const d2 = new Date(end + 'T00:00:00');
  if (d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear()) {
    return `${d1.getDate()}–${d2.getDate()} ${BULAN[d1.getMonth()]} ${d1.getFullYear()}`;
  }
  if (d1.getFullYear() === d2.getFullYear()) {
    return `${d1.getDate()} ${BULAN[d1.getMonth()]} – ${d2.getDate()} ${BULAN[d2.getMonth()]} ${d1.getFullYear()}`;
  }
  return `${d1.getDate()} ${BULAN[d1.getMonth()]} ${d1.getFullYear()} – ${d2.getDate()} ${BULAN[d2.getMonth()]} ${d2.getFullYear()}`;
}

let state = seedAwal();
let ui = {
  page: 'jadwal', // 'jadwal' | 'pengecualian'
  mode: 'minggu', // 'minggu' | 'bulan' (dalam halaman Jadwal)
  weekStart: mondayOfWeek(TODAY_ISO),
  month: TODAY_ISO.slice(0, 7),
  prefillDari: null,
  prefillSampai: null,
  pengecualianFilter: 'semua', // 'semua' | 'mendatang' | 'riwayat'
};

function dispatch(action) {
  state = reduce(state, action);
  render();
}

// ---------- shared helpers ----------

function dokterById(id) { return state.dokter.find(d => d.id === id); }
function layananById(id) { return state.layanan.find(l => l.id === id); }
function layananUntukDokter(dokterId) { return state.layanan.filter(l => l.dokterIds.includes(dokterId)); }

// ADR-0022: satu Layanan cuma untuk satu dokter dalam satu waktu — cari apakah dokter LAIN
// sudah punya blok jadwal untuk Layanan yang sama, di hari & jam yang tumpang tindih.
function cariBlokLayananTumpang(state, dokterId, layananId, hari, mulai, selesai) {
  for (const d of state.dokter) {
    if (d.id === dokterId) continue;
    const bentrok = (state.jadwal[d.id] || []).find(
      b => b.layananId === layananId && b.hari === hari && menit(b.mulai) < menit(selesai) && menit(mulai) < menit(b.selesai)
    );
    if (bentrok) return { dokterId: d.id, ...bentrok };
  }
  return null;
}

function badgeStatus(status) {
  return status === 'confirmed'
    ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">confirmed</span>'
    : '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">perlu dijadwal ulang</span>';
}
function badgeVisit(vs) {
  const map = { 'belum-tiba': 'bg-slate-100 text-slate-600', 'menunggu': 'bg-sky-100 text-sky-700', 'sedang-dilayani': 'bg-indigo-100 text-indigo-700', 'selesai': 'bg-slate-200 text-slate-500' };
  return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${map[vs] || 'bg-slate-100 text-slate-600'}">${vs}</span>`;
}
function wireTandaiTiba(root, dokterId) {
  root.querySelectorAll('[data-tandai-tiba]').forEach(btn => {
    btn.onclick = () => dispatch({ type: 'TANDAI_TIBA_DEMO', dokterId, apptId: btn.getAttribute('data-tandai-tiba') });
  });
}
function daftarAppointmentDokter(dokterId) {
  return [...(state.appointments[dokterId] || [])]
    .filter(a => a.tanggal >= TODAY_ISO)
    .sort((a, b) => (a.tanggal + a.mulai).localeCompare(b.tanggal + b.mulai));
}

// =====================================================================
// Kartu: Jadwal Rutin Mingguan (mode "minggu")
// =====================================================================
function htmlJadwalMinggu(dokterId) {
  const blocks = state.jadwal[dokterId] || [];
  const jamMulaiGrid = 7, jamSelesaiGrid = 19;
  const pastWeekdays = HARI_TAMPIL.filter(h => tanggalUntukHari(ui.weekStart, h) < TODAY_ISO);
  const seluruhMingguLewat = pastWeekdays.length === 7;

  function cellShaded(hari, jam) {
    return blocks.some(b => b.hari === hari && menit(b.mulai) <= jam * 60 && jam * 60 < menit(b.selesai));
  }
  function jamCellClass(hari, jam, past) {
    const shaded = cellShaded(hari, jam);
    if (past) return shaded ? 'bg-slate-300' : 'bg-slate-100';
    return shaded ? 'bg-teal-200' : 'bg-slate-50';
  }
  function appointmentTanggal(iso) {
    return (state.appointments[dokterId] || []).filter(a => a.tanggal === iso);
  }
  function appointmentDiJam(iso, jam) {
    return appointmentTanggal(iso).find(a => menit(a.mulai) <= jam * 60 && jam * 60 < menit(a.selesai));
  }

  return `
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
    <h3 class="text-sm font-bold text-slate-700 mb-3">Jadwal Rutin Mingguan</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-[11px] border-collapse">
        <thead>
          <tr>
            <th class="w-10"></th>
            ${HARI_TAMPIL.map(hari => {
              const iso = tanggalUntukHari(ui.weekStart, hari);
              const past = iso < TODAY_ISO;
              const today = iso === TODAY_ISO;
              const jumlahAppt = appointmentTanggal(iso).length;
              return `<th class="font-semibold pb-1 ${past ? 'text-slate-300' : today ? 'text-teal-700' : 'text-slate-500'}">
                <div>${hari.slice(0, 3)}</div>
                <div class="text-[10px] font-normal mt-0.5 ${today ? 'inline-block bg-teal-100 rounded px-1' : ''}">${labelTanggalPendek(iso)}</div>
                ${jumlahAppt > 0 ? `<div class="mt-0.5"><span class="text-[10px] font-semibold ${past ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white'} rounded-full px-1.5">${jumlahAppt} appt</span></div>` : ''}
              </th>`;
            }).join('')}
          </tr>
        </thead>
        <tbody>
          ${Array.from({ length: jamSelesaiGrid - jamMulaiGrid }, (_, i) => jamMulaiGrid + i).map(jam => `
            <tr>
              <td class="text-slate-400 text-right pr-1 align-top">${String(jam).padStart(2, '0')}</td>
              ${HARI_TAMPIL.map(hari => {
                const iso = tanggalUntukHari(ui.weekStart, hari);
                const appt = appointmentDiJam(iso, jam);
                const dotCls = appt ? (appt.status === 'perlu_dijadwal_ulang' ? 'bg-amber-500' : 'bg-indigo-600') : '';
                return `<td class="h-4 border border-slate-100 ${jamCellClass(hari, jam, iso < TODAY_ISO)} text-center align-middle" ${appt ? `title="${escapeHtml(appt.pasien)} ${appt.mulai}–${appt.selesai}"` : ''}>
                  ${appt ? `<span class="inline-block w-1.5 h-1.5 rounded-full ${dotCls}"></span>` : ''}
                </td>`;
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="text-[10.5px] text-slate-400 mt-1.5 flex items-center gap-1.5">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-indigo-600"></span> ada appointment terkonfirmasi pada jam itu
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-500 ml-2"></span> perlu dijadwal ulang
    </div>

    <h4 class="text-xs font-semibold text-slate-500 uppercase mt-4 mb-2">Blok jadwal</h4>
    <div class="flex flex-wrap gap-1.5 mb-3">
      ${blocks.length === 0 ? '<span class="text-xs text-slate-400 italic">Belum ada blok jadwal.</span>' : blocks.map(b => {
        const lewat = pastWeekdays.includes(b.hari);
        const layananNama = (layananById(b.layananId) || {}).nama || '—';
        return `<span class="inline-flex items-center gap-1 text-xs rounded-full px-2 py-1 border ${lewat ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-teal-50 text-teal-700 border-teal-200'}">
          ${b.hari} ${b.mulai}–${b.selesai} <span class="opacity-70">· ${escapeHtml(layananNama)}</span>
          ${lewat ? '<span class="text-[10px] italic">(lewat)</span>' : `<button data-hapus-blok="${b.id}" class="font-bold ml-0.5">&times;</button>`}
        </span>`;
      }).join('')}
    </div>
    ${(() => {
      const layananDokter = layananUntukDokter(dokterId);
      if (seluruhMingguLewat) {
        return `<div class="text-xs text-slate-400 italic bg-slate-50 rounded-lg p-3">Minggu ini sudah lewat — jadwal hanya bisa diubah untuk minggu berjalan atau mendatang. Gunakan tombol "Hari ini" atau navigasi ›.</div>`;
      }
      if (layananDokter.length === 0) {
        return `<div class="text-xs text-slate-400 italic bg-slate-50 rounded-lg p-3">Dokter ini belum eligible untuk Layanan apa pun — atur eligibilitas Layanan dulu sebelum menambah blok jadwal.</div>`;
      }
      return `<div class="flex gap-2 items-end bg-slate-50 rounded-xl p-3 flex-wrap">
          <div class="flex-1 min-w-[110px]"><label class="block text-[11px] text-slate-500 mb-1">Hari</label>
            <select id="b-new-hari" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm">${HARI_TAMPIL.map(h => `<option ${pastWeekdays.includes(h) ? 'disabled' : ''}>${h}</option>`).join('')}</select></div>
          <div class="flex-1 min-w-[140px]"><label class="block text-[11px] text-slate-500 mb-1">Layanan</label>
            <select id="b-new-layanan" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm">${layananDokter.map(l => `<option value="${l.id}">${escapeHtml(l.nama)}</option>`).join('')}</select></div>
          <div><label class="block text-[11px] text-slate-500 mb-1">Mulai</label><input type="time" id="b-new-mulai" value="08:00" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm"></div>
          <div><label class="block text-[11px] text-slate-500 mb-1">Selesai</label><input type="time" id="b-new-selesai" value="12:00" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm"></div>
          <button id="b-add-blok" class="text-sm font-semibold px-3 py-1.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700">+ Tambah</button>
        </div>`;
    })()}
  </div>`;
}

function wireJadwalMinggu(root, dokterId) {
  root.querySelectorAll('[data-hapus-blok]').forEach(btn => { btn.onclick = () => dispatch({ type: 'HAPUS_BLOK', dokterId, blokId: btn.getAttribute('data-hapus-blok') }); });
  const btnAdd = document.getElementById('b-add-blok');
  if (btnAdd) {
    btnAdd.onclick = () => {
      dispatch({
        type: 'TAMBAH_BLOK', dokterId,
        hari: document.getElementById('b-new-hari').value,

        mulai: document.getElementById('b-new-mulai').value,
        selesai: document.getElementById('b-new-selesai').value,
      });
    };
  }
}

// =====================================================================
// Kartu: Kalender Bulan (mode "bulan") — reuses Variant A's calendar idea
// =====================================================================
function htmlKalenderBulan(dokterId) {
  const cells = selDalamBulan(ui.month);

  function statusHari(iso) {
    const { jendela } = jendelaEfektif(state, dokterId, iso);
    const p = (state.pengecualian[dokterId] || []).find(x => x.tanggal === iso);
    const apptCount = (state.appointments[dokterId] || []).filter(a => a.tanggal === iso).length;
    if (p && p.tipe === 'cuti') return { cls: 'bg-rose-50 border-rose-200 text-rose-700', label: 'Cuti', apptCount };
    if (jendela.length === 0) return { cls: 'bg-slate-50 border-slate-200 text-slate-400', label: hariDariTanggal(iso) === 'Minggu' ? 'Tutup' : '—', apptCount };
    if (p && p.tipe === 'jam_khusus') return { cls: 'bg-amber-50 border-amber-200 text-amber-700', label: jendela.map(w => `${w.mulai}–${w.selesai}`).join(', '), apptCount };
    return { cls: 'bg-emerald-50 border-emerald-200 text-emerald-700', label: jendela.map(w => `${w.mulai}–${w.selesai}`).join(', '), apptCount };
  }

  return `
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
    <h3 class="text-sm font-bold text-slate-700 mb-3">Kalender Efektif</h3>
    <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-semibold text-slate-400 mb-1">
      ${HARI_TAMPIL.map(h => `<div>${h.slice(0, 3)}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-1.5">
      ${cells.map(iso => {
        if (!iso) return `<div></div>`;
        const past = iso < TODAY_ISO;
        const today = iso === TODAY_ISO;
        const s = statusHari(iso);
        const cls = past ? 'bg-slate-50 border-slate-100 text-slate-300' : s.cls;
        return `<button data-bulan-day="${iso}" ${past ? 'disabled' : ''} class="text-left rounded-lg border ${cls} px-2 py-2 h-16 flex flex-col justify-between ${past ? 'cursor-not-allowed' : 'hover:shadow-md transition'} ${today ? 'ring-2 ring-teal-500' : ''}">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold">${iso.slice(-2)}</span>
            ${!past && s.apptCount ? `<span class="text-[10px] font-semibold bg-indigo-600 text-white rounded-full px-1.5">${s.apptCount}</span>` : ''}
          </div>
          <div class="text-[10px] leading-tight">${past ? '' : s.label}</div>
        </button>`;
      }).join('')}
    </div>
    <div class="flex gap-4 mt-3 text-[11px] text-slate-500 flex-wrap">
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-200"></span> Jadwal rutin</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-amber-200"></span> Jam khusus</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-rose-200"></span> Cuti</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-slate-200"></span> Tidak praktik / tutup</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-slate-50 border border-slate-100"></span> Sudah lewat</span>
    </div>
    <div class="text-[11px] text-slate-400 mt-2">Klik tanggal mendatang untuk membuka halaman Pengecualian &amp; Cuti dengan tanggal itu terisi.</div>
  </div>`;
}

function wireKalenderBulan(root) {
  root.querySelectorAll('[data-bulan-day]').forEach(btn => {
    btn.onclick = () => {

      render();

  });
}

      </div>
      <div class="flex items-center gap-2">
        <button id="nav-prev" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-50">‹</button>
        <div class="text-sm font-semibold text-slate-700 min-w-[170px] text-center">${navLabel}</div>
        <button id="nav-next" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-50">›</button>
        <button id="nav-today" class="text-xs font-semibold px-3 py-2 rounded-lg border border-teal-600 text-teal-700 bg-white hover:bg-teal-50">Hari ini</button>
      </div>
    </div>

    ${konflikBanner}

    ${ui.mode === 'minggu' ? htmlJadwalMinggu(dokterId) : htmlKalenderBulan(dokterId)}`;

  root.querySelectorAll('[data-mode]').forEach(btn => { btn.onclick = () => { ui.mode = btn.getAttribute('data-mode'); render(); }; });
  document.getElementById('nav-prev').onclick = () => {
    if (ui.mode === 'minggu') ui.weekStart = addDays(ui.weekStart, -7);
    else ui.month = bulanKe(ui.month, -1);
    render();
  };
  document.getElementById('nav-next').onclick = () => {
    if (ui.mode === 'minggu') ui.weekStart = addDays(ui.weekStart, 7);
    else ui.month = bulanKe(ui.month, 1);
    render();
  };
  document.getElementById('nav-today').onclick = () => {
    ui.weekStart = mondayOfWeek(TODAY_ISO);
    ui.month = TODAY_ISO.slice(0, 7);
    render();
  };

  if (ui.mode === 'minggu') wireJadwalMinggu(root, dokterId);
  else wireKalenderBulan(root);

  if (konflik) {
    if (konflik.blocked) document.getElementById('jadwal-dismiss').onclick = () => dispatch({ type: 'BATALKAN_KONFLIK' });
    else {
      document.getElementById('jadwal-batal').onclick = () => dispatch({ type: 'BATALKAN_KONFLIK' });
      document.getElementById('jadwal-paksa').onclick = () => dispatch({ type: 'LANJUTKAN_PAKSA', alasan: document.getElementById('jadwal-alasan').value });
    }
  }
}

// =====================================================================
// Halaman: Pengecualian & Cuti (daftar terfilter + form pengajuan)
// =====================================================================
function semuaPengecualianLintasDokter() {
  const rows = [];
  for (const d of state.dokter) {
    for (const p of (state.pengecualian[d.id] || [])) rows.push({ ...p, dokterId: d.id, dokterNama: d.nama });
  }
  return rows.sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.dokterNama.localeCompare(b.dokterNama));
}

function renderPagePengecualian(root, dokterId, konflik) {
  const semua = semuaPengecualianLintasDokter();
  const mendatang = semua.filter(p => p.tanggal >= TODAY_ISO);
  const riwayat = semua.filter(p => p.tanggal < TODAY_ISO);
  const filter = ui.pengecualianFilter;
  const filtered = filter === 'mendatang' ? mendatang : filter === 'riwayat' ? riwayat : semua;

  let konflikBanner = '';
  if (konflik) {
    const dokterKonflik = dokterById(konflik.dokterId);
    if (konflik.blocked) {
      konflikBanner = `<div class="bg-rose-50 border border-rose-200 rounded-xl p-4 mb-4">
        <div class="font-semibold text-rose-700 mb-1">✗ "${escapeHtml(konflik.aksiLabel)}" (${escapeHtml(dokterKonflik.nama)}) ditolak total</div>
        <div class="text-sm text-rose-700 mb-2">Pasien berikut sudah tiba di klinik — perubahan lewat back-office tidak bisa dipaksakan:</div>
        <ul class="list-disc ml-5 text-sm text-rose-700 mb-2">${konflik.appointments.filter(a => a.visitStatus !== 'belum-tiba').map(a => `<li>${escapeHtml(a.pasien)} — ${a.tanggal} ${a.mulai}–${a.selesai} (${a.visitStatus})</li>`).join('')}</ul>
        <button id="peng-dismiss" class="text-xs font-semibold underline text-rose-700">Tutup</button>
      </div>`;
    } else {
      konflikBanner = `<div class="bg-amber-50 border border-amber-300 rounded-xl p-4 mb-4">
        <div class="font-semibold text-amber-800 mb-1">⚠️ "${escapeHtml(konflik.aksiLabel)}" (${escapeHtml(dokterKonflik.nama)}) akan memengaruhi appointment terkonfirmasi</div>
        <ul class="list-disc ml-5 text-sm text-amber-800 mb-2">${konflik.appointments.map(a => `<li>${escapeHtml(a.pasien)} — ${a.tanggal} ${a.mulai}–${a.selesai}</li>`).join('')}</ul>
        <label class="block text-xs font-medium text-amber-800 mb-1">Alasan (wajib, untuk audit log)</label>
        <input id="peng-alasan" class="w-full border border-amber-300 rounded-lg px-2 py-1.5 text-sm mb-2" placeholder="mis. dokter cuti mendadak">
        <div class="flex gap-2">
          <button id="peng-batal" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-300 bg-white">Batalkan</button>
          <button id="peng-paksa" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-amber-600 text-white">Lanjutkan &amp; tandai "perlu dijadwal ulang"</button>
        </div>
      </div>`;
    }
  }

  root.innerHTML = `
    ${konflikBanner}
    <div class="grid grid-cols-3 gap-5">
      <div class="col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div>
            <h3 class="text-sm font-bold text-slate-700">Daftar Pengecualian &amp; Cuti</h3>
            <p class="text-[11px] text-slate-400">Semua dokter — untuk kebutuhan audit.</p>
          </div>
          <div class="flex gap-1.5">
            <button data-filter="semua" class="text-xs font-semibold px-3 py-1.5 rounded-full border ${filter === 'semua' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-300'}">Semua (${semua.length})</button>
            <button data-filter="mendatang" class="text-xs font-semibold px-3 py-1.5 rounded-full border ${filter === 'mendatang' ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-600 border-slate-300'}">Mendatang (${mendatang.length})</button>
            <button data-filter="riwayat" class="text-xs font-semibold px-3 py-1.5 rounded-full border ${filter === 'riwayat' ? 'bg-slate-500 text-white border-slate-500' : 'bg-white text-slate-600 border-slate-300'}">Riwayat (${riwayat.length})</button>
          </div>
        </div>
        <div class="text-[11px] text-slate-400 mb-2">Riwayat (tanggal yang sudah lewat) tetap ditampilkan untuk kebutuhan audit — hanya tidak bisa lagi diubah/dihapus.</div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-[11px] uppercase text-slate-400">
              <tr><th class="text-left py-1.5 px-2">Dokter</th><th class="text-left py-1.5 px-2">Tanggal</th><th class="text-left py-1.5 px-2">Hari</th><th class="text-left py-1.5 px-2">Tipe</th><th class="text-left py-1.5 px-2">Jam</th><th class="text-left py-1.5 px-2">Status</th><th class="px-2"></th></tr>
            </thead>
            <tbody>
              ${filtered.length === 0 ? '<tr><td colspan="7" class="text-xs text-slate-400 italic py-3 px-2">Tidak ada data untuk filter ini.</td></tr>' : filtered.map(p => {
                const lewat = p.tanggal < TODAY_ISO;
                return `<tr class="border-t border-slate-100 ${lewat ? 'text-slate-400' : ''}">
                  <td class="py-1.5 px-2 font-medium ${lewat ? '' : 'text-slate-700'}">${escapeHtml(p.dokterNama)}</td>
                  <td class="py-1.5 px-2">${p.tanggal}</td>
                  <td class="py-1.5 px-2">${hariDariTanggal(p.tanggal)}</td>
                  <td class="py-1.5 px-2">${p.tipe === 'cuti' ? 'Cuti' : 'Jam khusus'}</td>
                  <td class="py-1.5 px-2">${p.tipe === 'jam_khusus' ? `${p.mulai}–${p.selesai}` : '—'}</td>
                  <td class="py-1.5 px-2">${lewat ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">Riwayat</span>' : '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Akan datang</span>'}</td>
                  <td class="py-1.5 px-2 text-right">${lewat ? '' : `<button data-hapus-pengecualian="${p.id}" data-dokter-id="${p.dokterId}" class="text-xs font-semibold text-rose-600">Hapus</button>`}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <h3 class="text-sm font-bold text-slate-700 mb-1">Ajukan Pengecualian</h3>
        <p class="text-[11px] text-slate-500 mb-3">Untuk <span class="font-semibold text-slate-700">${escapeHtml(dokterById(dokterId).nama)}</span> — ganti dokter lewat slider di atas.</p>
        <div class="space-y-2 bg-slate-50 rounded-xl p-3">
          <select id="p-tipe" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
            <option value="cuti">Cuti (rentang tanggal)</option>
            <option value="jam_khusus">Jam khusus (satu tanggal)</option>
          </select>
          <div id="p-cuti-range" class="flex gap-2">
            <div class="flex-1"><label class="block text-[11px] text-slate-500 mb-1">Dari</label><input type="date" id="p-dari" min="${TODAY_ISO}" value="${ui.prefillDari || ''}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm"></div>
            <div class="flex-1"><label class="block text-[11px] text-slate-500 mb-1">Sampai</label><input type="date" id="p-sampai" min="${TODAY_ISO}" value="${ui.prefillSampai || ''}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm"></div>
          </div>
          <div id="p-jam-khusus" class="hidden space-y-2">
            <input type="date" id="p-tanggal" min="${TODAY_ISO}" value="${ui.prefillDari || ''}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
            <div class="flex gap-2">
              <input type="time" id="p-mulai" value="08:00" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
              <input type="time" id="p-selesai" value="12:00" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
            </div>
          </div>
          <div class="text-[10.5px] text-slate-400">Hanya untuk hari ini atau tanggal mendatang.</div>
          <button id="p-add" class="w-full text-sm font-semibold py-1.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700">+ Tambah pengecualian</button>
        </div>
      </div>
    </div>`;

  root.querySelectorAll('[data-filter]').forEach(btn => { btn.onclick = () => { ui.pengecualianFilter = btn.getAttribute('data-filter'); render(); }; });
  root.querySelectorAll('[data-hapus-pengecualian]').forEach(btn => {
    btn.onclick = () => dispatch({ type: 'HAPUS_PENGECUALIAN', dokterId: btn.getAttribute('data-dokter-id'), id: btn.getAttribute('data-hapus-pengecualian') });
  });

  const tipeSel = document.getElementById('p-tipe');
  function syncTipeUI() {
    const isCuti = tipeSel.value === 'cuti';
    document.getElementById('p-cuti-range').classList.toggle('hidden', !isCuti);
    document.getElementById('p-jam-khusus').classList.toggle('hidden', isCuti);
  }
  tipeSel.onchange = syncTipeUI;
  syncTipeUI();
  document.getElementById('p-add').onclick = () => {
    ui.prefillDari = null; ui.prefillSampai = null;
    if (tipeSel.value === 'cuti') {
      const dari = document.getElementById('p-dari').value;
      const sampai = document.getElementById('p-sampai').value || dari;
      if (!dari) return;
      dispatch({ type: 'TAMBAH_CUTI_RENTANG', dokterId, dari, sampai });
    } else {
      const tanggal = document.getElementById('p-tanggal').value;
      if (!tanggal) return;
      dispatch({ type: 'TAMBAH_PENGECUALIAN', dokterId, tanggal, tipe: 'jam_khusus', mulai: document.getElementById('p-mulai').value, selesai: document.getElementById('p-selesai').value });
    }
  };

  if (konflik) {
    if (konflik.blocked) document.getElementById('peng-dismiss').onclick = () => dispatch({ type: 'BATALKAN_KONFLIK' });
    else {
      document.getElementById('peng-batal').onclick = () => dispatch({ type: 'BATALKAN_KONFLIK' });
      document.getElementById('peng-paksa').onclick = () => dispatch({ type: 'LANJUTKAN_PAKSA', alasan: document.getElementById('peng-alasan').value });
    }
  }
}

// =====================================================================
// Halaman utama: shell (judul, tab halaman, slider dokter) + konten
// =====================================================================
function renderHalaman(root) {
  const dokterId = state.selectedDokter;
  // Jadwal hanya pernah diedit untuk dokter yang sedang dipilih di slider, jadi tetap
  // dicocokkan ke dokterId itu. Tapi Pengecualian & Cuti kini menampilkan SEMUA dokter
  // (untuk audit) dan baris "Hapus" di sana bisa memicu konflik untuk dokter mana pun,
  // bukan cuma yang sedang dipilih — jadi jangan disaring dengan dokterId di sini.
  const konflikJadwal = state.pendingKonflik && state.pendingKonflik.dokterId === dokterId && state.pendingKonflik.rawAction.type === 'HAPUS_BLOK' ? state.pendingKonflik : null;
  const konflikPengecualian = state.pendingKonflik && ['TAMBAH_PENGECUALIAN', 'HAPUS_PENGECUALIAN', 'TAMBAH_CUTI_RENTANG'].includes(state.pendingKonflik.rawAction.type) ? state.pendingKonflik : null;

  root.innerHTML = `
  <div class="max-w-6xl mx-auto px-6 py-6">
    <div class="mb-4">
      <h1 class="text-xl font-bold text-slate-900">Penjadwalan Dokter</h1>
      <p class="text-sm text-slate-500">Kelola jadwal rutin, pengecualian, dan cuti per dokter.</p>
    </div>

    <div class="flex gap-2 mb-4">
      <button data-page="jadwal" class="text-sm font-semibold px-4 py-2 rounded-lg ${ui.page === 'jadwal' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'}">Jadwal</button>
      <button data-page="pengecualian" class="text-sm font-semibold px-4 py-2 rounded-lg ${ui.page === 'pengecualian' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'}">Pengecualian &amp; Cuti</button>
    </div>

    <div class="flex items-center gap-2 mb-4">
      <button id="dokter-scroll-left" class="shrink-0 w-7 h-7 rounded-full border border-slate-300 bg-white hover:bg-slate-50 text-sm flex items-center justify-center">‹</button>
      <div id="dokter-slider" class="flex gap-2 overflow-x-auto scroll-smooth no-scrollbar flex-1 min-w-0">
        ${state.dokter.map(d => `<button data-dokter="${d.id}" class="shrink-0 whitespace-nowrap text-sm font-semibold px-4 py-2 rounded-full border ${d.id === dokterId ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}">${escapeHtml(d.nama)}</button>`).join('')}
      </div>
      <button id="dokter-scroll-right" class="shrink-0 w-7 h-7 rounded-full border border-slate-300 bg-white hover:bg-slate-50 text-sm flex items-center justify-center">›</button>
    </div>

    <div id="page-body"></div>
  </div>`;

  root.querySelectorAll('[data-page]').forEach(btn => { btn.onclick = () => { ui.page = btn.getAttribute('data-page'); render(); }; });
  root.querySelectorAll('[data-dokter]').forEach(btn => { btn.onclick = () => dispatch({ type: 'SELECT_DOKTER', dokterId: btn.getAttribute('data-dokter') }); });
  document.getElementById('dokter-scroll-left').onclick = () => document.getElementById('dokter-slider').scrollBy({ left: -220, behavior: 'smooth' });
  document.getElementById('dokter-scroll-right').onclick = () => document.getElementById('dokter-slider').scrollBy({ left: 220, behavior: 'smooth' });

  const pageBody = document.getElementById('page-body');
  if (ui.page === 'jadwal') renderPageJadwal(pageBody, dokterId, konflikJadwal);
  else renderPagePengecualian(pageBody, dokterId, konflikPengecualian);
}

// =====================================================================
// Orkestrasi
// =====================================================================
function renderLog() {
  const body = document.getElementById('log-body');
  body.innerHTML = state.log.slice(-30).map((l, i) => `<div>${String(i + 1).padStart(2, '0')} ${escapeHtml(l.text)}</div>`).join('');
  body.scrollTop = body.scrollHeight;
}

function renderDemoPanel() {
  const dokterId = state.selectedDokter;
  const body = document.getElementById('demo-body');
  const list = daftarAppointmentDokter(dokterId);
  body.innerHTML = list.length === 0
    ? `<div class="text-xs text-slate-400 italic">Tidak ada appointment untuk ${escapeHtml(dokterById(dokterId).nama)}.</div>`
    : list.map(a => `
      <div class="flex items-center justify-between gap-2 text-xs border-b border-slate-100 py-1.5 last:border-b-0">
        <span class="text-slate-600">${escapeHtml(a.pasien)} — ${a.tanggal} ${a.mulai}</span>
        ${a.visitStatus === 'belum-tiba'
          ? `<button data-tandai-tiba="${a.id}" class="text-[11px] font-semibold text-teal-700 underline shrink-0">tandai tiba</button>`
          : `<span class="text-[10px] text-slate-400 shrink-0">${a.visitStatus}</span>`}
      </div>`).join('');
  wireTandaiTiba(body, dokterId);
}

function render() {
  renderHalaman(document.getElementById('app-root'));
  renderLog();
  renderDemoPanel();
}

document.getElementById('log-toggle').onclick = () => {
  const body = document.getElementById('log-body');
  const collapsed = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  document.getElementById('log-toggle').textContent = `Riwayat aksi ${collapsed ? '▴' : '▾'}`;
};
document.getElementById('demo-toggle').onclick = () => {
  const body = document.getElementById('demo-body');
  const collapsed = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  document.getElementById('demo-toggle').textContent = `Demo: tandai pasien tiba ${collapsed ? '▴' : '▾'}`;
};

render();
</script>
</body>
</html>
