<title>PROTOTYPE — Klinik Staff Login</title>
<!--
  PROTOTYPE — throwaway code, do not build on top of this.

  Question: what should the login page for Klinik *staff* (Admin Klinik,
  Resepsionis, Staf Layanan, Dokter) look like — the screen that precedes
  role-dashboard.prototype.html? Distinct from
  booking-user-login-sso.prototype.html, which is the Patient-facing User
  login (Google SSO / email+password, OTP-gated) for the booking app —
  this one is staff signing into the clinic's own management side.

  Per ADR 0028, staff never has a password set *for* them — Admin Klinik
  invites by email and the staff member sets their own password via the
  invite link, so the email+password path has no "temporary password"
  concept. Until that invite is accepted, login isn't usable yet (see
  Undangan Akun, CONTEXT.md), surfaced as an explicit error rather than a
  generic "wrong password." Per ADR 0029, a Dokter's login access can also
  be revoked independently of deactivating their profile — modeled here as
  a separate "dinonaktifkan" account status with its own error message,
  distinct from "diundang."

  UPDATE (feedback round 1 — consolidation + 2FA): three variants were
  tried — A (Panel Split Klinik), B (Kartu Progresif, email-then-password),
  C (Pilih Peran Dulu, role tile picker). Feedback picked **Variant A**; B
  and C are gone, along with the variant switcher — there's only one
  screen now. On top of picking A:
    - Added "Masuk dengan Google" (SSO), matching the login-method choice
      already established in booking-user-login-sso.prototype.html, though
      Google SSO for *staff* isn't part of the CONTEXT.md/ADR domain yet
      (Undangan Akun only documents email+password) — modeled here as a
      prototyping exploration, not a settled decision. Demo-only: it
      always resolves to one fixed Google-linked identity (Ni Made Sari /
      Admin Klinik) after a brief "menghubungkan" delay, then feeds into
      the same lookupAccount() blocked-state checks as the password path.
    - Added a second-factor OTP step after either login path succeeds —
      also a new exploration, not yet in CONTEXT.md/ADR — with a choice of
      delivery: WhatsApp (a code "sent" to the staff member's phone) or an
      Authenticator app (a 6-digit TOTP the staff member already has
      configured). Any 6-digit code is accepted in this prototype, same as
      the "kode apa saja tetap diterima" convention in
      booking-user-login-sso.prototype.html.
    - The WhatsApp option has a "Kirim ulang kode" resend control with a
      30s cooldown, reusing the exact resend/cooldown pattern from
      booking-user-login-sso.prototype.html (direct DOM update on tick
      rather than a full re-render, so the code input isn't disturbed).
      The Authenticator option has no resend — the code just rotates on
      the staff member's own device.

  Canned ACCOUNTS cover all three login outcomes staff can hit: aktif
  (logs in fine, then hits the OTP step), diundang (invite sent, not yet
  accepted — blocked per ADR 0028, before OTP is ever reached), dinonaktif
  (login revoked per ADR 0029, likewise blocked pre-OTP). Demo credentials
  are listed on-screen and click-to-fill, since there's no real backend to
  check against. A successful login (email+password or Google, then OTP)
  doesn't actually navigate anywhere — it renders a "berhasil masuk"
  confirmation naming the role/dashboard it would hand off to, matching
  the prototype-skill rule against wiring to real navigation/mutations.
  Same clinic identity (Klinik Sehat Bahagia) as role-dashboard.prototype
  .html, and the same dokter roster/email domain/phone numbers
  (kliniksehat.id, 0812111100xx) as dokter-management.prototype.html, so
  all three read as one clinic.

  No backend, no persistence — everything is canned in-memory data, reset
  on reload.

  Run: open this file directly in a browser (double-click / File > Open).
-->

<script>
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

// ---------------------------------------------------------------------------
// Canned domain data (see CONTEXT.md) — same clinic identity as
// role-dashboard.prototype.html, same dokter roster/email domain/phone
// numbers as dokter-management.prototype.html.
// ---------------------------------------------------------------------------
const KLINIK = { name: 'Klinik Sehat Bahagia', kota: 'Bandung' };

const ROLES = [
  { key: 'admin_klinik', label: 'Admin Klinik' },
  { key: 'resepsionis', label: 'Resepsionis' },
  { key: 'staf_layanan', label: 'Staf Layanan' },
  { key: 'dokter', label: 'Dokter' },
];

const GOOGLE_DEMO_EMAIL = 'admin@kliniksehat.id';

const ACCOUNTS = [
  { email: 'admin@kliniksehat.id', password: 'admin123', nama: 'Ni Made Sari', role: 'admin_klinik', status: 'aktif', telepon: '081211110010' },
  { email: 'dewi@kliniksehat.id', password: 'resepsionis123', nama: 'Dewi Lestari', role: 'resepsionis', status: 'aktif', telepon: '081211110011' },
  { email: 'agus@kliniksehat.id', password: 'staflayanan123', nama: 'Agus Setiawan', role: 'staf_layanan', status: 'aktif', telepon: '081211110012' },
  { email: 'amelia@kliniksehat.id', password: 'dokter123', nama: 'dr. Amelia Putri', role: 'dokter', status: 'aktif', telepon: '081211110001' },
  { email: 'citra@kliniksehat.id', password: null, nama: 'dr. Citra Dewi', role: 'dokter', status: 'diundang', telepon: '081211110003' },
  { email: 'yusuf@kliniksehat.id', password: 'dokter123', nama: 'dr. Yusuf Hakim', role: 'dokter', status: 'dinonaktifkan', telepon: '081211110006' },
];

function roleLabel(key) { return ROLES.find(r => r.key === key)?.label ?? key; }
function accountByEmail(email) { return ACCOUNTS.find(a => a.email.toLowerCase() === String(email || '').trim().toLowerCase()); }
function maskPhone(telepon) { return telepon.slice(0, 4) + '-' + '•'.repeat(telepon.length - 7) + '-' + telepon.slice(-3); }

// Given an email, returns { ok, account, error }.
//   ok: true         — account exists and is loggable-in-principle (email+
//                       password still needs its own password check; Google
//                       SSO treats this alone as sufficient to proceed to OTP)
//   ok: false         — unknown email, or a known email whose status blocks
//                       login outright (diundang / dinonaktifkan) — no
//                       password or SSO will ever help either of those
function lookupAccount(email) {
  const acc = accountByEmail(email);
  if (!acc) return { ok: false, error: 'Email atau password salah.' };
  if (acc.status === 'diundang') {
    return { ok: false, account: acc, error: 'Undangan akun untuk email ini belum diterima. Cek email Anda untuk link undangan dan atur password terlebih dahulu.' };
  }
  if (acc.status === 'dinonaktifkan') {
    return { ok: false, account: acc, error: 'Akses login untuk akun ini telah dinonaktifkan. Hubungi Admin Klinik Anda.' };
  }
  return { ok: true, account: acc };
}

function attemptLogin(email, password) {
  const found = lookupAccount(email);
  if (!found.ok) return found;
  // wrong-password and unknown-email share the same generic message so a
  // login attempt never reveals whether an email is registered
  if (found.account.password !== password) return { ok: false, error: 'Email atau password salah.' };
  return { ok: true, account: found.account };
}

// ---------------------------------------------------------------------------
// Shared state

function initialState() {

    email: '',
    password: '',
    error: null,

    pendingAccount: null,   // account that passed login, awaiting OTP
    otpMethod: 'whatsapp',  // 'whatsapp' | 'authenticator'
    otpCode: '',
    otpError: null,
    forgotOpen: false,
    forgotEmail: '',
    forgotSent: false,

}
let state = initialState();
function resetLoginState() { state = initialState(); render(); }

        <path fill="#4CAF50" d="M24 41.5c5.6 0 10.7-2.1 14.5-5.7l-6.7-5.5c-2 1.5-4.7 2.5-7.8 2.5-5.3 0-9.7-3.4-11.3-8.1l-6.7 5.2C9.6 36.8 16.2 41.5 24 41.5z"/>

// ---------------------------------------------------------------------------
// Screen — OTP (second factor after email+password or Google succeeds)
// ---------------------------------------------------------------------------
function renderOtp() {
  const acc = state.pendingAccount;
  const methodTab = (key, label) => `
    <button data-action="otp-method" data-method="${key}"
            class="flex-1 text-sm font-medium py-2 rounded-lg ${state.otpMethod === key ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${label}</button>`;

function initials(nama) { return nama.replace(/^dr\.\s*/i, '').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

// ---------------------------------------------------------------------------
// OTP resend cooldown — direct DOM update on tick (not a full render), same
// pattern as booking-user-login-sso.prototype.html, so the code input the
// staff member is typing into is never disturbed.
// ---------------------------------------------------------------------------
let otpResendTimer = null;
function startResendTimer(seconds) {
  if (otpResendTimer) clearInterval(otpResendTimer);
  let remaining = seconds;
  const tick = () => {
    const btn = document.getElementById('otpResendBtn');
    if (!btn) { clearInterval(otpResendTimer); otpResendTimer = null; return; } // left the OTP screen or switched method
    if (remaining <= 0) {
      btn.disabled = false;
      btn.textContent = 'Kirim ulang kode';
      btn.classList.remove('text-slate-400');
      btn.classList.add('text-slate-700', 'underline', 'hover:text-slate-900');
      clearInterval(otpResendTimer); otpResendTimer = null;
    } else {
      btn.disabled = true;
      btn.textContent = `Kirim ulang kode (${remaining}s)`;
      remaining--;
    }
  };
  tick();
  otpResendTimer = setInterval(tick, 1000);
}

// ---------------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------------
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;

  if (kind === 'login') {
    const result = attemptLogin(state.email, state.password);
    if (result.ok) { goToOtp(result.account); }
    else { state.error = result.error; render(); }
    return;
  }

  if (kind === 'otp') {
    if (!/^\d{6}$/.test(state.otpCode.trim())) {
      state.otpError = 'Kode harus 6 digit angka.';
      render();
      return;
    }
    state.otpError = null;
    state.step = 'success';
    render();
    return;
  }
});

document.addEventListener('input', e => {
  const bind = e.target.dataset.bind;
  if (!bind) return;
  state[bind] = bind === 'otpCode' ? e.target.value.replace(/\D/g, '').slice(0, 6) : e.target.value;
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;

  if (action === 'fill-demo') {
    state.email = t.dataset.email;
    state.password = t.dataset.password;
    state.error = null;
    render();
    requestAnimationFrame(() => document.querySelector('[data-bind="password"], [data-bind="email"]')?.focus());
  }
  if (action === 'google-login') { startGoogleLogin(); }
  if (action === 'logout') { resetLoginState(); }
  if (action === 'back-to-login') { resetLoginState(); }
  if (action === 'otp-method') {
    state.otpMethod = t.dataset.method;
    state.otpCode = '';
    state.otpError = null;
    render();
  }
  if (action === 'resend-otp') {
    document.getElementById('otpResendNote').textContent = 'Kode baru terkirim (demo: kode apa saja tetap diterima).';
    startResendTimer(30);
  }
  if (action === 'open-forgot') { state.forgotOpen = true; render(); }
  if (action === 'close-forgot') { state.forgotOpen = false; state.forgotSent = false; render(); }
  if (action === 'submit-forgot') { state.forgotSent = true; render(); }
});

function goToOtp(account) {
  state.pendingAccount = account;
  state.step = 'otp';
  state.otpMethod = 'whatsapp';
  state.otpCode = '';
  state.otpError = null;
  state.error = null;
  render();
}

function startGoogleLogin() {
  state.error = null;
  state.googleConnecting = true;
  render();
  setTimeout(() => {
    state.googleConnecting = false;
    const result = lookupAccount(GOOGLE_DEMO_EMAIL);
    if (result.ok) { goToOtp(result.account); }
    else { state.error = result.error; render(); }
  }, 900);
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render() {
  const screens = { login: renderLogin, otp: renderOtp, success: renderSuccess };
  document.getElementById('app').innerHTML = screens[state.step]();
  if (state.step === 'otp' && state.otpMethod === 'whatsapp') startResendTimer(30);
}

render();
</script>
</body>
</html>
