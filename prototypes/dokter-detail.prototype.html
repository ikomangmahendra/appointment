<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — Ubah Dokter</title>
<!--
  PROTOTYPE — throwaway code, do not build on top of this.

  Sibling route to dokter-management.prototype.html (feedback: "tapilkan
  tambah dan ubah data dokter di halaman yang berbeda", matching the
  existing patient-management -> patient-detail split). A dedicated page
  for viewing/editing one Dokter's profile — nama, Spesialisasi (a <select>
  from the platform-wide curated list, ADR 0026), No. HP, Foto, Biografi,
  Layanan eligibility (ADR 0022) — plus the account-invite lifecycle
  (belum ada akun -> diundang -> aktif) that used to live inline in the
  list's now-removed slide-over.

  This file has its own copy of the roster (see dokter-management's for
  the "real" shared shape) so it stays a single double-clickable file.

  Run: open this file directly in a browser (double-click / File > Open).
  Try: ?id=d1..d8 — d3/d7 are "diundang", d5/d8 are "belum ada akun".
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<div class="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs px-4 py-2 text-center">
  🧪 PROTOTYPE — data contoh, tidak tersambung ke backend, tidak tersimpan. Reload untuk reset.
</div>

<div id="app"></div>

<script>
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

const LAYANAN = [
  { id: 'l1', nama: 'Konsultasi Umum' },
  { id: 'l2', nama: 'Gigi' },
  { id: 'l3', nama: 'Fisioterapi' },
  { id: 'l4', nama: 'Anak' },
  { id: 'l5', nama: 'Mata' },
  { id: 'l6', nama: 'THT' },
  { id: 'l7', nama: 'Kulit & Kelamin' },
  { id: 'l8', nama: 'Jantung' },
];

const SPESIALISASI_LIST = ['Umum', 'Gigi', 'Anak', 'Mata', 'THT', 'Kulit & Kelamin', 'Jantung', 'Fisioterapi'];

let DOKTER = [
  { id: 'd1', nama: 'dr. Amelia Putri', spesialisasi: 'Umum', telepon: '081211110001', email: 'amelia@kliniksehat.id', akun: 'aktif', layananIds: ['l1'], foto: null, biografi: 'Dokter umum dengan 8 tahun pengalaman di layanan primer.' },
  { id: 'd2', nama: 'dr. Bagus Santoso', spesialisasi: 'Gigi', telepon: '081211110002', email: 'bagus@kliniksehat.id', akun: 'aktif', layananIds: ['l2'], foto: null, biografi: '' },
  { id: 'd3', nama: 'dr. Citra Dewi', spesialisasi: 'Fisioterapi', telepon: '081211110003', email: 'citra@kliniksehat.id', akun: 'diundang', layananIds: ['l3'], foto: null, biografi: '' },
  { id: 'd4', nama: 'dr. Dimas Wijaya', spesialisasi: 'Anak', telepon: '081211110004', email: 'dimas@kliniksehat.id', akun: 'aktif', layananIds: ['l1', 'l4'], foto: null, biografi: 'Fokus pada tumbuh kembang anak usia 0-12 tahun.' },
  { id: 'd5', nama: 'dr. Rina Hartono', spesialisasi: 'Mata', telepon: '081211110005', email: null, akun: 'belum ada akun', layananIds: ['l5'], foto: null, biografi: '' },
  { id: 'd6', nama: 'dr. Yusuf Hakim', spesialisasi: 'THT', telepon: '081211110006', email: 'yusuf@kliniksehat.id', akun: 'aktif', layananIds: ['l6'], foto: null, biografi: '' },
  { id: 'd7', nama: 'dr. Maya Kusuma', spesialisasi: 'Kulit & Kelamin', telepon: '081211110007', email: 'maya@kliniksehat.id', akun: 'diundang', layananIds: ['l7'], foto: null, biografi: '' },
  { id: 'd8', nama: 'dr. Hendra Saputra', spesialisasi: 'Jantung', telepon: '081211110008', email: null, akun: 'belum ada akun', layananIds: ['l8'], foto: null, biografi: '' },
];

const id = new URLSearchParams(location.search).get('id') || 'd1';
const dokter = DOKTER.find(d => d.id === id) || DOKTER[0];
const state = { fotoDataUrl: dokter.foto, toast: null };

function initials(nama) { return nama.replace(/^dr\.\s*/i, '').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

function akunBadge(akun) {
  const map = {
    'aktif': 'bg-emerald-100 text-emerald-700',
    'diundang': 'bg-amber-100 text-amber-700',
    'belum ada akun': 'bg-slate-200 text-slate-600',
  };
  return `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${map[akun]}">${akun}</span>`;
}

function handleFotoChange(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { state.fotoDataUrl = e.target.result; render(); };
  reader.readAsDataURL(file);
}

function saveForm(e) {
  e.preventDefault();
  const nama = document.getElementById('f-nama').value.trim();
  const spesialisasi = document.getElementById('f-spesialisasi').value;
  const telepon = document.getElementById('f-telepon').value.trim();
  if (!nama || !spesialisasi || !telepon) { alert('Nama, spesialisasi, dan No. HP wajib diisi.'); return; }
  const biografi = document.getElementById('f-biografi').value.trim();
  const layananIds = [...document.querySelectorAll('.f-layanan:checked')].map(cb => cb.value);
  Object.assign(dokter, { nama, spesialisasi, telepon, biografi, layananIds, foto: state.fotoDataUrl });
  state.toast = 'Perubahan disimpan.';
  render();
}

function undang() {
  const email = prompt(`Kirim undangan akun ke email untuk ${dokter.nama}:`, dokter.email || '');
  if (!email) return;
  dokter.email = email.trim();
  dokter.akun = 'diundang';
  state.toast = `Undangan dikirim ke ${dokter.email}.`;
  render();
}

function kirimUlangUndangan() {
  state.toast = `Undangan dikirim ulang ke ${dokter.email}.`;
  render();
}

function simulasikanLogin() {
  dokter.akun = 'aktif';
  state.toast = '(demo) Login pertama berhasil — akun aktif.';
  render();
}

function layananCheckboxes(selectedIds) {
  return LAYANAN.map(l => `
    <label class="flex items-center gap-2 text-sm px-2 py-1.5 rounded-md border border-slate-200 hover:bg-slate-50 cursor-pointer">
      <input type="checkbox" class="f-layanan" value="${l.id}" ${selectedIds.includes(l.id) ? 'checked' : ''}>
      ${l.nama}
    </label>`).join('');
}

function render() {
  document.getElementById('app').innerHTML = `
    <div class="max-w-3xl mx-auto p-6">
      <a href="dokter-management.prototype.html" class="text-sm text-slate-500 hover:underline">← Kembali ke Direktori Dokter</a>

      <div class="flex items-center gap-4 mt-3 mb-6">
        <div class="w-16 h-16 rounded-full overflow-hidden bg-blue-100 text-blue-700 flex items-center justify-center text-lg font-semibold shrink-0">
          ${state.fotoDataUrl ? `<img src="${state.fotoDataUrl}" class="w-full h-full object-cover">` : initials(dokter.nama)}
        </div>
        <div>
          <h1 class="text-lg font-semibold text-slate-800">${esc(dokter.nama)}</h1>
          <p class="text-sm text-slate-500">${esc(dokter.spesialisasi)} · ${esc(dokter.telepon)}</p>
        </div>
      </div>

      ${state.toast ? `<div class="mb-5 text-sm bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg px-4 py-2">${esc(state.toast)}</div>` : ''}

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form onsubmit="saveForm(event)" class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
          <h2 class="text-sm font-semibold text-slate-700 mb-1">Ubah Data Dokter</h2>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-2">Foto</label>
            <div class="flex items-center gap-4">
              <div class="w-16 h-16 rounded-full overflow-hidden bg-blue-100 text-blue-700 flex items-center justify-center text-lg font-semibold shrink-0">
                ${state.fotoDataUrl ? `<img src="${state.fotoDataUrl}" class="w-full h-full object-cover">` : initials(dokter.nama)}
              </div>
              <label class="cursor-pointer">
                <span class="inline-block bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-1.5 rounded-lg">Ganti Foto</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleFotoChange(this)">
              </label>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Nama</label>
            <input id="f-nama" value="${esc(dokter.nama)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Spesialisasi</label>
            <select id="f-spesialisasi" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
              ${SPESIALISASI_LIST.map(s => `<option value="${s}" ${dokter.spesialisasi === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">No. HP</label>
            <input id="f-telepon" value="${esc(dokter.telepon)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Biografi <span class="text-slate-400 font-normal">(opsional)</span></label>
            <textarea id="f-biografi" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Latar belakang, pengalaman, fokus praktik…">${esc(dokter.biografi)}</textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-2">Layanan yang dapat ditangani</label>
            <div class="grid grid-cols-2 gap-2">${layananCheckboxes(dokter.layananIds)}</div>
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">Simpan Perubahan</button>
        </form>

        <div class="space-y-4">
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-medium text-slate-500">Akun login</span>
              ${akunBadge(dokter.akun)}
            </div>
            <div class="text-sm text-slate-600 mb-3">${dokter.email ? esc(dokter.email) : 'Belum ada email terdaftar'}</div>
            ${dokter.akun === 'belum ada akun' ? `<button onclick="undang()" class="text-sm font-medium text-blue-600 hover:underline">Undang ke akun →</button>` : ''}
            ${dokter.akun === 'diundang' ? `<div class="flex flex-col gap-2 items-start"><button onclick="kirimUlangUndangan()" class="text-sm font-medium text-blue-600 hover:underline">Kirim ulang undangan</button><button onclick="simulasikanLogin()" class="text-xs text-slate-400 hover:underline">(demo) tandai sudah login</button></div>` : ''}
            ${dokter.akun === 'aktif' ? `<span class="text-sm text-emerald-700">✓ Sudah bisa login</span>` : ''}
          </div>

          <a href="penjadwalan-dokter.prototype.html" class="block bg-white rounded-xl shadow-sm border border-slate-200 p-5 text-sm font-medium text-slate-600 hover:text-blue-600 hover:border-blue-200">
            Atur Jadwal & Pengecualian →
          </a>
        </div>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
