<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — Ubah Staff</title>
<!--
  PROTOTYPE — throwaway code, do not build on top of this.

  Sibling route to staff-management.prototype.html, mirroring the
  dokter-management -> dokter-detail split. A dedicated page for
  viewing/editing one staff member's profile — Nama, Role, Email, Layanan
  assignment (Staf Layanan only), No. HP — plus three independent
  lifecycle panels:

    - Akun login: the same Undangan Akun invite lifecycle already modeled
      in dokter-detail.prototype.html (diundang -> aktif).
    - Verifikasi dua langkah: see the feedback-round-1 note below.
    - Status Staff: an aktif/nonaktif toggle, generalizing ADR 0029's
      "Menonaktifkan Dokter is independent of login revocation" to every
      staff role. Flagged here (and in staff-management.prototype.html's
      header) as a generalization this prototype assumes but a follow-up
      domain-modeling pass should confirm/formalize with its own ADR —
      including what should happen if the *last* Admin Klinik tries to
      deactivate themselves (this prototype only warns, doesn't block).

  This file has its own copy of the roster (see staff-management's for the
  "real" shared shape) so it stays a single double-clickable file.

  UPDATE (feedback round 1):
    - Email is now required, editable in the main form like Nama/No. HP.
      Since every staff member now has an email from creation onward, the
      invite is always sent immediately — the "belum ada akun" state and
      its undang() flow are gone (kirimUlangUndangan/simulasikanLogin
      still apply to "diundang").
    - Added a Verifikasi Dua Langkah panel (shown once an account is
      aktif): staff pick WhatsApp OTP or an Authenticator App (TOTP).
      This extends Issue #1's Implementation Decisions, which currently
      specify staff auth as email+password only, with no OTP/2FA step —
      flagging here rather than silently overriding, since a
      domain-modeling pass still needs to decide whether it's mandatory,
      opt-in, or applies per-role. Who *chooses* the method is also
      unresolved: this stub exposes it as an Admin-Klinik-toggleable demo
      control, but in practice the staff member would more plausibly pick
      it themselves during onboarding, the same way they set their own
      password (ADR 0028).

  Run: open this file directly in a browser (double-click / File > Open).
  Try: ?id=s1..s8 — s3/s6/s7 are "diundang", s8 is "nonaktif", s1 is the
  only "Admin Klinik" (try deactivating it).
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<div class="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs px-4 py-2 text-center">
  🧪 PROTOTYPE — data contoh, tidak tersambung ke backend, tidak tersimpan. Reload untuk reset.
</div>

<div id="app"></div>

<script>
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

const LAYANAN = [
  { id: 'l1', nama: 'Konsultasi Umum' },
  { id: 'l2', nama: 'Gigi' },
  { id: 'l3', nama: 'Fisioterapi' },
  { id: 'l4', nama: 'Anak' },
  { id: 'l5', nama: 'Mata' },
  { id: 'l6', nama: 'THT' },
  { id: 'l7', nama: 'Kulit & Kelamin' },
  { id: 'l8', nama: 'Jantung' },
];

const ROLES = ['Admin Klinik', 'Resepsionis', 'Staf Layanan'];

let STAFF = [
  { id: 's1', nama: 'Sari Wulandari', role: 'Admin Klinik', telepon: '081311110001', email: 'sari@kliniksehat.id', akun: 'aktif', layananId: null, nonaktif: false, otpMethod: 'authenticator' },
  { id: 's2', nama: 'Budi Santoso', role: 'Resepsionis', telepon: '081311110002', email: 'budi@kliniksehat.id', akun: 'aktif', layananId: null, nonaktif: false, otpMethod: 'whatsapp' },
  { id: 's3', nama: 'Dewi Anggraini', role: 'Resepsionis', telepon: '081311110003', email: 'dewi@kliniksehat.id', akun: 'diundang', layananId: null, nonaktif: false, otpMethod: null },
  { id: 's4', nama: 'Fajar Nugroho', role: 'Staf Layanan', telepon: '081311110004', email: 'fajar@kliniksehat.id', akun: 'aktif', layananId: 'l1', nonaktif: false, otpMethod: null },
  { id: 's5', nama: 'Gita Permata', role: 'Staf Layanan', telepon: '081311110005', email: 'gita@kliniksehat.id', akun: 'aktif', layananId: 'l2', nonaktif: false, otpMethod: 'whatsapp' },
  { id: 's6', nama: 'Hadi Kurniawan', role: 'Staf Layanan', telepon: '081311110006', email: 'hadi@kliniksehat.id', akun: 'diundang', layananId: 'l3', nonaktif: false, otpMethod: null },
  { id: 's7', nama: 'Indah Lestari', role: 'Staf Layanan', telepon: '081311110007', email: 'indah@kliniksehat.id', akun: 'diundang', layananId: 'l4', nonaktif: false, otpMethod: null },
  { id: 's8', nama: 'Joko Prasetyo', role: 'Resepsionis', telepon: '081311110008', email: 'joko@kliniksehat.id', akun: 'aktif', layananId: null, nonaktif: true, otpMethod: 'authenticator' },
];

const id = new URLSearchParams(location.search).get('id') || 's1';
const staff = STAFF.find(s => s.id === id) || STAFF[0];
const state = { role: staff.role, toast: null };

function initials(nama) { return nama.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

function akunBadge(akun) {
  const map = {
    'aktif': 'bg-emerald-100 text-emerald-700',
    'diundang': 'bg-amber-100 text-amber-700',
  };
  return `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${map[akun]}">${akun}</span>`;
}

function otpLabel(m) { return m === 'whatsapp' ? 'WhatsApp OTP' : m === 'authenticator' ? 'Authenticator App' : 'Belum diatur'; }

function updateRole(v) { state.role = v; render(); }

function saveForm(e) {
  e.preventDefault();
  const nama = document.getElementById('f-nama').value.trim();
  const role = state.role;
  const email = document.getElementById('f-email').value.trim();
  const telepon = document.getElementById('f-telepon').value.trim();
  if (!nama || !role || !email || !telepon) { alert('Nama, role, email, dan No. HP wajib diisi.'); return; }
  let layananId = staff.layananId;
  if (role === 'Staf Layanan') {
    layananId = document.getElementById('f-layanan').value;
    if (!layananId) { alert('Pilih Layanan untuk Staf Layanan ini.'); return; }
  } else {
    layananId = null;
  }
  Object.assign(staff, { nama, role, email, telepon, layananId });
  state.toast = 'Perubahan disimpan.';
  render();
}

function aturOtp(method) {
  staff.otpMethod = method;
  state.toast = `(demo) Metode verifikasi dua langkah diatur ke ${otpLabel(method)}.`;
  render();
}

function kirimUlangUndangan() {
  state.toast = `Undangan dikirim ulang ke ${staff.email}.`;
  render();
}

function simulasikanLogin() {
  staff.akun = 'aktif';
  state.toast = '(demo) Login pertama berhasil — akun aktif.';
  render();
}

function toggleNonaktif() {
  if (!staff.nonaktif) {
    const adminAktifLain = STAFF.filter(s => s.role === 'Admin Klinik' && !s.nonaktif && s.id !== staff.id).length;
    if (staff.role === 'Admin Klinik' && adminAktifLain === 0) {
      alert('(demo) Ini satu-satunya Admin Klinik yang masih aktif — menonaktifkannya akan membuat klinik ini tanpa admin. Belum ada aturan resmi untuk kasus ini, lihat catatan di komentar file.');
      return;
    }
    if (!confirm(`Nonaktifkan ${staff.nama}? Akun login tidak ikut dicabut — itu langkah terpisah.`)) return;
  }
  staff.nonaktif = !staff.nonaktif;
  state.toast = staff.nonaktif ? `${staff.nama} dinonaktifkan.` : `${staff.nama} diaktifkan kembali.`;
  render();
}

function layananSelect(selectedId) {
  return `
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Layanan</label>
      <select id="f-layanan" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
        <option value="">Pilih layanan…</option>
        ${LAYANAN.map(l => `<option value="${l.id}" ${selectedId === l.id ? 'selected' : ''}>${l.nama}</option>`).join('')}
      </select>
    </div>`;
}

function render() {
  document.getElementById('app').innerHTML = `
    <div class="max-w-3xl mx-auto p-6">
      <a href="staff-management.prototype.html" class="text-sm text-slate-500 hover:underline">← Kembali ke Direktori Staff</a>

      <div class="flex items-center gap-4 mt-3 mb-6">
        <div class="w-16 h-16 rounded-full overflow-hidden bg-blue-100 text-blue-700 flex items-center justify-center text-lg font-semibold shrink-0">${initials(staff.nama)}</div>
        <div>
          <h1 class="text-lg font-semibold text-slate-800">${esc(staff.nama)} ${staff.nonaktif ? '<span class="text-xs font-medium text-rose-600 align-middle ml-1">(nonaktif)</span>' : ''}</h1>
          <p class="text-sm text-slate-500">${esc(staff.role)}${staff.layananId ? ' · ' + LAYANAN.find(l => l.id === staff.layananId).nama : ''} · ${esc(staff.telepon)}</p>
        </div>
      </div>

      ${state.toast ? `<div class="mb-5 text-sm bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg px-4 py-2">${esc(state.toast)}</div>` : ''}

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form onsubmit="saveForm(event)" class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
          <h2 class="text-sm font-semibold text-slate-700 mb-1">Ubah Data Staff</h2>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Nama</label>
            <input id="f-nama" value="${esc(staff.nama)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Role</label>
            <select id="f-role" onchange="updateRole(this.value)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
              ${ROLES.map(r => `<option value="${r}" ${state.role === r ? 'selected' : ''}>${r}</option>`).join('')}
            </select>
          </div>
          ${state.role === 'Staf Layanan' ? layananSelect(staff.layananId) : ''}
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
            <input id="f-email" type="email" value="${esc(staff.email)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">No. HP</label>
            <input id="f-telepon" value="${esc(staff.telepon)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">Simpan Perubahan</button>
        </form>

        <div class="space-y-4">
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-medium text-slate-500">Akun login</span>
              ${akunBadge(staff.akun)}
            </div>
            <div class="text-sm text-slate-600 mb-3">${esc(staff.email)}</div>
            ${staff.akun === 'diundang' ? `<div class="flex flex-col gap-2 items-start"><button onclick="kirimUlangUndangan()" class="text-sm font-medium text-blue-600 hover:underline">Kirim ulang undangan</button><button onclick="simulasikanLogin()" class="text-xs text-slate-400 hover:underline">(demo) tandai sudah login</button></div>` : ''}
            ${staff.akun === 'aktif' ? `<span class="text-sm text-emerald-700">✓ Sudah bisa login</span>` : ''}
          </div>

          ${staff.akun === 'aktif' ? `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium text-slate-500">Verifikasi dua langkah</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${staff.otpMethod ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">${otpLabel(staff.otpMethod)}</span>
            </div>
            <p class="text-xs text-slate-500 mb-3">Kode OTP via WhatsApp, atau kode dari Authenticator App (TOTP) — staff biasanya memilih sendiri saat login pertama; ini kontrol demo untuk mengubahnya.</p>
            <div class="flex gap-3">
              <button onclick="aturOtp('whatsapp')" ${staff.otpMethod === 'whatsapp' ? 'disabled' : ''} class="text-sm font-medium ${staff.otpMethod === 'whatsapp' ? 'text-slate-300 cursor-default' : 'text-blue-600 hover:underline'}">WhatsApp OTP</button>
              <button onclick="aturOtp('authenticator')" ${staff.otpMethod === 'authenticator' ? 'disabled' : ''} class="text-sm font-medium ${staff.otpMethod === 'authenticator' ? 'text-slate-300 cursor-default' : 'text-blue-600 hover:underline'}">Authenticator App</button>
            </div>
          </div>` : ''}

          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium text-slate-500">Status staff</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${staff.nonaktif ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">${staff.nonaktif ? 'nonaktif' : 'aktif'}</span>
            </div>
            <p class="text-xs text-slate-500 mb-3">Menonaktifkan tidak mencabut akun login — itu langkah terpisah, dilakukan di panel di atas.</p>
            <button onclick="toggleNonaktif()" class="text-sm font-medium ${staff.nonaktif ? 'text-blue-600' : 'text-rose-600'} hover:underline">${staff.nonaktif ? 'Aktifkan Kembali' : 'Nonaktifkan Staff'}</button>
          </div>
        </div>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
