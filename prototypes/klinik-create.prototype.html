<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — Provisi Klinik</title>
<!--
  PROTOTYPE — throwaway code, do not build on top of this.

  Sibling route to klinik-management.prototype.html, matching the
  directory -> create/detail split already established by Dokter
  Management. A dedicated page for a Super-Admin to provision a new Klinik
  tenant: nama, alamat, zona waktu, plus (optional at this step) inviting
  that Klinik's first Admin Klinik account by email — same invite-by-email,
  self-set-password shape as Undangan Akun (ADR 0028), just performed by
  Super-Admin instead of Admin Klinik since no Admin Klinik exists yet for
  a brand-new Klinik. See CONTEXT.md for Platform/Klinik/Super-Admin.

  No backend: submitting just shows a recap, same as dokter-create's
  pattern. This file has its own copy of ZONA_LIST so it stays a single
  double-clickable file — see klinik-management.prototype.html for the
  shared roster shape.

  Run: open this file directly in a browser (double-click / File > Open).
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<div class="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs px-4 py-2 text-center">
  🧪 PROTOTYPE — data contoh, tidak tersambung ke backend, tidak tersimpan.
</div>

<div id="app"></div>

<script>
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

const ZONA_LIST = ['WIB', 'WITA', 'WIT'];

const state = { saved: null };

function initials(nama) { return (nama || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

function submitForm(e) {
  e.preventDefault();
  const nama = document.getElementById('f-nama').value.trim();
  const alamat = document.getElementById('f-alamat').value.trim();
  const zona = document.getElementById('f-zona').value;
  const adminNama = document.getElementById('f-admin-nama').value.trim();
  const adminEmail = document.getElementById('f-admin-email').value.trim();
  if (!nama || !alamat || !zona) { alert('Nama klinik, alamat, dan zona waktu wajib diisi.'); return; }
  if ((adminNama && !adminEmail) || (!adminNama && adminEmail)) { alert('Nama dan email Admin Klinik harus diisi berdua, atau dikosongkan berdua untuk diundang nanti.'); return; }

  state.saved = { nama, alamat, zona, adminNama: adminNama || null, adminEmail: adminEmail || null };
  render();
}

function resetForm() {
  state.saved = null;
  render();
}

function render() {
  if (state.saved) {
    const s = state.saved;
    document.getElementById('app').innerHTML = `
      <div class="max-w-md mx-auto p-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center">
          <div class="w-16 h-16 mx-auto rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl font-semibold mb-4">${initials(s.nama)}</div>
          <h1 class="text-lg font-semibold text-slate-800 mb-1">Klinik diprovisi</h1>
          <p class="text-sm text-slate-500 mb-4">${esc(s.nama)} · ${s.zona} · ${esc(s.alamat)}</p>
          ${s.adminEmail
            ? `<div class="text-sm bg-amber-50 border border-amber-200 text-amber-700 rounded-lg px-4 py-2 mb-6">Undangan Admin Klinik terkirim ke <strong>${esc(s.adminEmail)}</strong> (${esc(s.adminNama)}).</div>`
            : `<div class="text-sm bg-slate-50 border border-slate-200 text-slate-500 rounded-lg px-4 py-2 mb-6">Belum ada Admin Klinik — undang dari halaman Kelola Klinik kapan saja.</div>`}
          <div class="flex gap-2 justify-center">
            <button onclick="resetForm()" class="px-4 py-2 text-sm font-medium text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Provisi Klinik Lain</button>
            <a href="klinik-management.prototype.html" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">← Kembali ke Daftar Klinik</a>
          </div>
        </div>
      </div>`;
    return;
  }

  document.getElementById('app').innerHTML = `
    <div class="max-w-lg mx-auto p-6">
      <a href="klinik-management.prototype.html" class="text-sm text-slate-500 hover:underline">← Kembali ke Daftar Klinik</a>
      <h1 class="text-lg font-semibold text-slate-800 mt-2 mb-5">Provisi Klinik</h1>

      <form onsubmit="submitForm(event)" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Nama Klinik</label>
          <input id="f-nama" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Klinik Nama Lengkap">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Alamat</label>
          <textarea id="f-alamat" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Jl. Nama Jalan No. xx, Kota"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Zona Waktu</label>
          <select id="f-zona" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="">Pilih zona waktu…</option>
            ${ZONA_LIST.map(z => `<option value="${z}">${z}</option>`).join('')}
          </select>
        </div>

        <div class="pt-2 border-t border-slate-100">
          <h2 class="text-sm font-semibold text-slate-700 mb-1">Admin Klinik Pertama <span class="text-slate-400 font-normal">(opsional — bisa diundang nanti)</span></h2>
          <p class="text-xs text-slate-500 mb-3">Admin Klinik mengatur password login mereka sendiri lewat link undangan, sama seperti Undangan Akun untuk Dokter/staf.</p>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Nama</label>
              <input id="f-admin-nama" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Nama Admin Klinik">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
              <input id="f-admin-email" type="email" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="admin@kliniknya.id">
            </div>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-lg">Provisi Klinik</button>
          <a href="klinik-management.prototype.html" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Batal</a>
        </div>
      </form>
    </div>`;
}

render();
</script>
</body>
</html>
